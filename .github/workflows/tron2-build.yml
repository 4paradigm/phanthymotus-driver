name: Validate TRON2 Driver

on:
  push:
    branches:
      - feat/tron2-arm-reset
      - main
    paths:
      - 'limx/tron2/**'
      - 'common/**'
      - '.github/workflows/tron2-build.yml'
      - 'scripts/check_service_yml.py'
      - 'tests/test_dockerfile_copies.py'
      - 'README_dev.md'
  pull_request:
    paths:
      - 'limx/tron2/**'
      - 'common/**'
      - '.github/workflows/tron2-build.yml'
      - 'scripts/check_service_yml.py'
      - 'tests/test_dockerfile_copies.py'
      - 'README_dev.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install -r limx/tron2/requirements.txt pytest
      - name: Check imports and sensor / actuator contracts (offline)
        run: |
          python -m compileall -q limx/tron2
          python -m unittest discover -s limx/tron2/tests -v
          python -m pytest tests/test_dockerfile_copies.py -q
          python scripts/check_service_yml.py limx/tron2
      - name: Image publication
        run: |
          echo 'This workflow validates source without registry credentials.' >> "$GITHUB_STEP_SUMMARY"
          echo 'PR images are built and published by the upstream PR Review Agent after /request_bot_review.' >> "$GITHUB_STEP_SUMMARY"
