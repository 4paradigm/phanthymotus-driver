name: Build TRON2 Driver Image

on:
  push:
    branches:
      - feat/tron2-arm-reset
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Tencent Cloud CR
        uses: docker/login-action@v3
        with:
          registry: bj-warehouse.tencentcloudcr.com
          username: ${{ secrets.TENCENT_CR_USERNAME }}
          password: ${{ secrets.TENCENT_CR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: bj-warehouse.tencentcloudcr.com/phanthy-motus/drivers/limx/tron2

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: limx/tron2/Dockerfile
          push: true
          tags: |
            bj-warehouse.tencentcloudcr.com/phanthy-motus/drivers/limx/tron2:release.${{ github.event.inputs.date || github.run_date }}.${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
