mcp_port: 15717
# Explicit, not blank: a blank value falls back to socket.gethostname(), which under Docker
# is the container's random hex short ID -- ROS topic names cannot start with a digit, so
# roughly 5/8 of container (re)starts crashed on the very first create_publisher() call
# (e.g. namespace "3a80e6c6f048" -> invalid topic "/3a80e6c6f048/agibot_x2/imu"). This is
# what caused the flaky deploy timeouts/crash-restart loops, independent of the "info" action
# bug fixed alongside this.
ros_namespace: "agibot_x2"

# Which end-effector variant this robot is built with — selects the URDF served by the
# `model` resource tool and the joint layout used by hand_state/hand_command.
# This unit reports HandType.NONE on both sides, so serve the matching no-finger model.
end_effector: "fist"   # fist | hand | ultra

ros:
  robot_domain_id: 0
  core_domain_id: 42
  # The X2 vendor ROS processes use the host's develop0 interface (10.0.1.41).
  robot_interface: "develop0"

plugins:
  mc_state:
    enabled: true
  joint_state:
    enabled: true
  hand_state:
    # This X2 reports HandType.NONE for both sides; enable after dexterous hands are provisioned.
    enabled: false
  imu:
    enabled: true
  leg_odometry:
    # X2's locomotion odometry; this is not SLAM/localization pose.
    enabled: true
  camera:
    enabled: true
  camera_depth:
    # No depth publisher exists on the verified X2 firmware.
    enabled: false
  lidar:
    # The optional SLAM lidar has no publisher until the vendor enables that module.
    enabled: false
  head_touch:
    enabled: true
  pmu_state:
    enabled: true
  system_state:
    enabled: true
  linkcraft:
    enabled: true
  mc_mode:
    enabled: true
    # Observed end-to-end on this unit: DAMPING_DEFAULT. PASSIVE_DEFAULT and
    # STAND_DEFAULT only acknowledged the request; do not expose them until their
    # physical behavior is verified. Never add SDK enum names without validation.
    allowed_actions: [damping_default]
    # State transitions such as stand_up_default can take longer than ordinary
    # query/service calls. This is the response wait only; it does not retry.
    service_timeout_sec: 20
  locomotion:
    enabled: true
    input_source_name: "phanthymotus"
    input_source_priority: 50
  preset_motion:
    enabled: true
  joint_command:
    enabled: true
  hand_command:
    enabled: false
  pmu_led:
    enabled: true
  tts:
    enabled: true
  emoji:
    enabled: true
  mic_source:
    enabled: true
  slam:
    enabled: false
