id: franka-dual-arm-driver
name: Franka FR3 dual arm (ROS 2 actions)
category: driver
hardware_provider: franka
hardware_model: dual-arm
image_name: franka-dual-arm
port: 15741
mcp_url: http://localhost:15741/mcp
description: "Left/right FR3 joint trajectories, cancellation, optional grippers and timestamped ROS 2 telemetry: measured/desired joints, TCP and estimated wrench. Requires configured franka_ros2 installation."
build_context_extras:
  - ../../common
cards:
  - {name: franka_left_state, type: sensor}
  - {name: franka_right_state, type: sensor}
  - {name: franka_left_arm, type: actuator}
  - {name: franka_right_arm, type: actuator}
  - {name: franka_left_gripper, type: actuator}
  - {name: franka_right_gripper, type: actuator}
