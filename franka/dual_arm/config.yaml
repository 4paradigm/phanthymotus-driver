name: Franka FR3 dual arm
mcp_port: 15741
ros:
  # The official controllers run on this same Linux host, in domain 0.
  robot_domain_id: 0
  core_domain_id: 42
franka:
  motion_enabled: false
  # Left and right FR3 arms; configure namespaces from the actual ROS graph.
  # These values do not identify or configure a native FR3 Duo installation.
  arms:
    left:
      trajectory_action: /left/fr3_arm_controller/follow_joint_trajectory
      joint_state_topic: /left/joint_states
      joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
      # Required before enabling motion: actual joint limits and site limits.
      lower: []
      upper: []
      max_velocity: []
      max_acceleration: []
      # Optional official franka_gripper GripperCommand action; empty disables it.
      gripper_action: ""
    right:
      trajectory_action: /right/fr3_arm_controller/follow_joint_trajectory
      joint_state_topic: /right/joint_states
      joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
      lower: []
      upper: []
      max_velocity: []
      max_acceleration: []
      gripper_action: ""
