# Optional deployment override. Provision a restricted key and verified host key first.
services:
  franka-fr3:
    environment:
      - FRANKA_REMOTE_HOST=${FRANKA_REMOTE_HOST:?set remote user and host}
      - FRANKA_REMOTE_DIR=${FRANKA_REMOTE_DIR:?set remote backend directory}
      - FRANKA_REMOTE_KEY=/run/franka-remote/id_ed25519
      - FRANKA_REMOTE_KNOWN_HOSTS=/run/franka-remote/known_hosts
    volumes:
      - ${FRANKA_REMOTE_ACCESS_DIR:?set SSH credential directory}:/run/franka-remote:ro
