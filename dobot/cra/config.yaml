mcp_port: 15746
name: "Dobot CRA 关节读取与运动"
ros_namespace: dobot_cra
# Configure through DOBOT_CONTROLLER_IP or the joints card. No robot is
# contacted until an address is supplied.
controller_ip: ""
feedback_port: 30004
model_name: ""
publish_hz: 30
# Lower bounds: both effective timeouts allow at least three feedback periods.
# Selecting 30006 automatically raises each to at least 3 seconds.
stale_timeout_s: 2
connect_timeout_s: 2
receive_timeout_s: 1
reconnect_delay_s: 1
joint_move:
  connect_timeout_s: 2
  receive_timeout_s: 2
ros:
  robot_domain_id: 42
  core_domain_id: 42
  robot_interface: eno1
