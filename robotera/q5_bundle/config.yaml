name: "RobotEra Q5 (Bundle)"
mcp_port: 15793
ros_namespace: ""
# `sensor_msgs/JointState` and the Q5 command interface use radians. Change
# this only after verifying a vendor-specific deviation from a raw ROS sample.
joint_state_position_unit: "radians"

plugins:
  base_drive:
    enabled: true
    # Deployment guardrails, not vendor-certified motion limits.
    max_linear_x_mps: 0.20
    max_angular_z_radps: 0.40
    max_duration_s: 2.0
    publish_rate_hz: 10.0
    stop_repetitions: 3
  joints:
    enabled: true
  joints_state:
    enabled: true
  robot_ready:
    enabled: true
  battery:
    enabled: true
  system_health:
    enabled: true
  hand_state:
    enabled: true
  nav_state:
    enabled: true
  estop:
    enabled: true
  diagnostics:
    enabled: true
  imu:
    # The source names and type are confirmed: /camera/camera/{accel,gyro}/sample
    # are sensor_msgs/msg/Imu. The 2026-08-11 inspection found zero publishers
    # for both streams, so retain this card disabled until the camera driver runs.
    enabled: false
  camera_depth:
    # No Image/depth publisher or camera driver is present in the observed ROS
    # graph. Do not use /slam/map_cmap: it is a SLAM PointCloud2 map, not depth.
    enabled: false
  simple_action:
    # Vendor action service, not direct joint control. Keep this disabled in
    # the default direct-control deployment.
    enabled: false
  arm_control:
    enabled: true
    hardware_enable: true
    # Q5 vendor sample: at most +0.05 rad from current, in 0.01-rad samples
    # spaced 0.3 s apart. URDF hard limits alone are not a safe move envelope.
    max_target_delta_rad: 0.050
    max_step_rad: 0.010
    publish_rate_hz: 3.3333333333
    hold_repetitions: 3
    # Keep the final arm target published until feedback has caught up.
    settle_tolerance_rad: 0.035
    settle_timeout_s: 1.5
  hand_control:
    enabled: true
    # Deployment guardrails, not vendor-certified XHand Lite joint limits.
    min_position_rad: 0.0
    max_position_rad: 1.0
    max_step_rad: 0.04
    max_duration_s: 2.0
    publish_rate_hz: 20.0
    hold_repetitions: 3
  hand_gesture:
    # Uses the same direct hand command publisher as hand_control.
    enabled: true
    max_duration_s: 2.0
    publish_rate_hz: 20.0
  head_control:
    # The neck joint names come from the bundled Q5 URDF and must match the
    # installed robot's /joint_states.
    enabled: true
    max_step_rad: 0.025
    publish_rate_hz: 20.0
    hold_repetitions: 3
