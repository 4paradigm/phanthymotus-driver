name: "RobotEra Q5 (Bundle)"
mcp_port: 15793
ros_namespace: ""
# `sensor_msgs/JointState` and the Q5 command interface use radians. Change
# this only after verifying a vendor-specific deviation from a raw ROS sample.
joint_state_position_unit: "radians"

plugins:
  mic:
    enabled: true
    sample_rate_hz: 16000
    channels: 1
  speaker:
    enabled: true
    device: "hw:2,0"
    sample_rate_hz: 16000
    channels: 1
    output_sample_rate_hz: 44100
    output_channels: 2
  audio:
    enabled: true
  camera_rgb:
    enabled: true
    max_hz: 15.0
    jpeg_quality: 70
    remote_start:
      enabled: true
      host: "192.168.8.100"
      user: "developer"
      password: "developer"
      port: 2222
      depth_profile: "848x480x30"
      color_profile: "848x480x30"
  camera_depth:
    enabled: true
    max_hz: 15.0
  arm_control:
    enabled: true
    hardware_enable: true
    # Q5 vendor sample: at most +0.05 rad from current, in 0.01-rad samples
    # spaced 0.3 s apart. URDF hard limits alone are not a safe move envelope.
    max_target_delta_rad: 0.050
    max_step_rad: 0.010
    publish_rate_hz: 3.3333333333
    hold_repetitions: 3
    # Keep the final arm target published until feedback has caught up.
    settle_tolerance_rad: 0.035
    settle_timeout_s: 1.5
  q5_control_mode:
    enabled: true
