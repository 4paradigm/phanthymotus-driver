<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>PiPER Mac 验收</title>
<style>
body{font:15px system-ui;margin:24px;background:#f3f5f8;color:#17202d}h1{font-size:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
section{background:white;padding:20px;border-radius:12px;border:1px solid #d8dfe9}
h2{font-size:18px;margin-top:0}label{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0}
select,input,button{font:inherit;padding:7px;border:1px solid #b7c4d5;border-radius:6px;max-width:190px}
button{cursor:pointer;background:#edf3ff;margin:4px 6px 4px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;max-height:400px;overflow:auto}
img{max-width:100%;border-radius:6px}.error{color:#ad2222}p{line-height:1.6}
</style>
<h1>PiPER · Mac 验收</h1>
<p>先读取状态，再预览动作。运动权限默认关闭。停止会尽力保持；失能需单独确认支撑。<br>Mac 显示本地照片；ROS 画布图像发布需 Ubuntu 环境验收。</p>
<div class="cards" id="cards"></div>
<script>
const titles={piper_status:'状态',piper_mode:'模式',piper_arm:'机械臂',piper_gripper:'夹爪',piper_photo:'拍照'};
const gripperLabels={open:'张开（先预览）',close:'闭合（先预览）',set_width:'指定开度（先预览）'};
const labels={read:'读取',preview:'预览切换',switch:'执行切换',stop_teaching:'停止示教',prepare:'初始化（先预览）',move_j1:'J1 移动（旧接口，直接执行）',move_joint:'单轴移动（先预览）',move_joints:'六关节移动（先预览）',return_pose:'返回六关节停放位',save_default:'保存停放位',return_default:'返回 J1 停放角度',hold:'保持当前状态',disable:'解除使能',capture:'拍照',info:'查看完成结果',start:'就绪',stop:'停止本卡片',reconnect:'重新连接'};
const fields={execute:'执行（false 为预览）',workspace_clear:'空间已清空',take_control:'其它程序已停止',other_controllers_stopped:'其它程序已停止',arm_supported:'已扶稳机械臂',object_supported:'夹持物已支撑',confirm_save:'确认保存当前姿态',allow_limit_adjustment:'允许预览中的限位修正',query_firmware:'重新查询实际固件',capture_confirmed:'确认本次拍摄当前画面',forward_view_confirmed:'旧版可选朝向记录',target_mode:'目标模式',target_deg:'目标角度（度）',joint:'关节编号',speed_deg_s:'速度（度/秒）',speed_pct:'SDK 速度上限（%）',width_mm:'开度（mm）',torque_nm:'力矩（N·m）',preview_id:'预览编号（可留空）'};
async function rpc(method,params={}){const r=await fetch('/mcp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});const b=await r.json();if(b.error)throw Error(b.error.message);if(b.result.isError)throw Error(b.result.content[0].text);return b.result;}
function show(section,result,error=false){const pre=section.querySelector('pre');pre.className=error?'error':'';pre.textContent=typeof result==='string'?result:JSON.stringify(result,null,2);if(result?.output){const img=section.querySelector('img');img.src='/photo?name='+encodeURIComponent(result.output.split('/').pop());img.hidden=false;}}
async function call(section,name,args){try{const b=await rpc('tools/call',{name,arguments:args});const result=JSON.parse(b.content[0].text);show(section,result);if(result.action_id){const deadline=Date.now()+65000;while(Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,350));const info=JSON.parse((await rpc('tools/call',{name,arguments:{action:'info'}})).content[0].text);if(info.last_action?.action_id===result.action_id){show(section,info.last_action.result,info.last_action.status!=='completed');return;}}show(section,'未收到完成结果，请停止本卡片并查看 info。',true);}}catch(e){show(section,e.message,true);}}
(async()=>{const tools=(await rpc('tools/list')).tools;for(const t of tools){const s=document.createElement('section');const title=document.createElement('h2');title.textContent=t.name+' · '+titles[t.name];s.append(title);const desc=document.createElement('p');desc.textContent=t.description;s.append(desc);const select=document.createElement('select');for(const a of t.inputSchema.properties.action.enum){const o=document.createElement('option');o.value=a;o.textContent=gripperLabels[a]||labels[a]||a;select.append(o);}select.value=t.name==='piper_mode'?'read':t.name==='piper_status'?'read':t.name==='piper_photo'?'capture':'info';s.append(select);const form=document.createElement('div');s.append(form);const draw=()=>{form.replaceChildren();const a=t.inputSchema['x-action-params'][select.value];for(const key of a.params){const p=t.inputSchema.properties[key];const label=document.createElement('label');const text=document.createElement('span');text.textContent=fields[key]||key;label.append(text);const input=document.createElement(p.enum?'select':'input');input.dataset.key=key;input.dataset.type=p.type;if(p.enum){for(const value of p.enum){const o=document.createElement('option');o.value=String(value);o.textContent=key==='target_mode'?({standby:'待机',can:'电脑控制（CAN）',teaching:'拖动示教'}[value]):String(value);input.append(o);}}else{input.type=p.type==='number'||p.type==='integer'?'number':'text';input.step=p.type==='integer'?'1':'any';if(p.minimum!==undefined)input.min=p.minimum;if(p.maximum!==undefined)input.max=p.maximum;}if(p.default!==undefined)input.value=p.default;label.append(input);form.append(label);} };select.onchange=draw;draw();const execute=document.createElement('button');execute.textContent='执行所选操作';execute.onclick=async()=>{const args={action:select.value};for(const input of form.querySelectorAll('[data-key]')){if(input.value==='')continue;args[input.dataset.key]=input.dataset.type==='boolean'?input.value==='true':['integer','number'].includes(input.dataset.type)?Number(input.value):input.value;}execute.disabled=true;await call(s,t.name,args);execute.disabled=false;};s.append(execute);if(t.type==='actuator'){const stop=document.createElement('button');stop.textContent='停止本卡片';stop.onclick=()=>call(s,t.name,{action:'stop'});s.append(stop);}s.append(document.createElement('pre'));const img=document.createElement('img');img.alt='本次 RGB 照片';img.hidden=true;s.append(img);document.getElementById('cards').append(s);}})().catch(e=>{document.getElementById('cards').textContent=e.message;});
</script></html>
