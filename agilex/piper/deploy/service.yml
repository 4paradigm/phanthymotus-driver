agilex-piper:
  container_name: embodied-agilex-piper
  image: __IMAGE__
  # Required for SocketCAN and the loopback-only DDS profile, including PR deployments.
  network_mode: host
  privileged: true
  volumes:
    - /dev:/dev
    - /opt/phanthy-motus/data/piper:/opt/phanthy-motus/data/piper
    - /opt/phanthy-motus/dds-local.xml:/opt/phanthy-motus/dds-local.xml:ro
  environment:
    - ROS_DOMAIN_ID=42
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/phanthy-motus/dds-local.xml
    - ROS_LOCALHOST_ONLY=0
    - PYTHONUNBUFFERED=1
    - AGENT_CORE_URL=https://localhost:15678
    - PIPER_MOTION_ENABLED=${PIPER_MOTION_ENABLED:-0}
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  restart: always
