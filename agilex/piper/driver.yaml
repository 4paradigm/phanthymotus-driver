id: agilex-piper-driver
name: AgileX PiPER Driver
category: driver
hardware_provider: agilex
hardware_model: piper
image_name: agilex-piper
port: 15741
mcp_url: "http://localhost:15741/mcp"
description: "PiPER Arm control, independent read-only Joints and On camera sensor cards, plus an optional calibrated gripper-to-table clearance sensor."
build_context_extras:
  - ../../common
cards:
  - { name: arm_control, type: actuator }
  - { name: joints, type: sensor }
  - { name: piper_table_clearance, type: sensor }
  - { name: piper_camera_live, type: sensor }
  - { name: piper_photo, type: actuator }
  - { name: model, type: resource }
