id: agilex-piper-driver
name: AgileX PiPER Driver
category: driver
hardware_provider: agilex
hardware_model: piper
image_name: agilex-piper
port: 15741
mcp_url: "http://localhost:15741/mcp"
description: "PiPER 十一张卡片：状态、实时角度与零位偏差、待机、CAN、使能、失能、单轴、夹爪、照片、许可、停止。中文提示，默认关闭运动许可。"
build_context_extras:
  - ../../common
cards:
  - { name: piper_status, type: resource }
  - { name: piper_zero_check, type: sensor }
  - { name: piper_standby, type: actuator }
  - { name: piper_can, type: actuator }
  - { name: piper_enable, type: actuator }
  - { name: piper_disable, type: actuator }
  - { name: piper_joint, type: actuator }
  - { name: piper_gripper, type: actuator }
  - { name: piper_photo, type: actuator }
  - { name: piper_permission, type: actuator }
  - { name: piper_stop, type: actuator }
