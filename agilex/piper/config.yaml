mcp_port: 15741
name: "PiPER 单臂与 D435"
ros_namespace: ""
can_interface: can0
data_dir: /opt/phanthy-motus/data/piper
async_actions: true
# Deployment may narrow these limits; SDK limits always apply as well.
joint_limits_deg:
  - [-150, 150]
  - [0, 180]
  - [-170, 0]
  - [-100, 100]
  - [-70, 70]
  - [-120, 120]
gripper_limits_mm: [0, 70]
intent_control:
  # Transform from SDK end-pose reference to the actual gripper-tip TCP.
  # [x,y,z,roll,pitch,yaw], mm/deg, Rz(yaw) Ry(pitch) Rx(roll).
  # Never substitute zero for an unknown reference. Verify on the installed tool.
  tcp_offset_mm_deg: null
  tcp_verified: false
  # Six measured angles, degrees. Save only an operator-approved return posture.
  preset_joints_deg: null
  # Default closed. Acceptance binds adapter serial, firmware, source/config hashes
  # and an operator-reviewed evidence record. Never enable from SDK support alone.
  point_to_point_acceptance: null
mode:
  # Exact versions returned by this SDK, NOT a version range. Keep empty until
  # MotionCtrl_1 enter/stop/exit has been witnessed on this robot without homing,
  # reboot, reset or unexpected torque loss, with results recorded in acceptance.
  verified_teaching_firmwares: []
camera:
  live:
    enabled: false
    width: 640
    height: 480
    fps: 10
    jpeg_quality: 80
  # Empty: auto-select only when exactly one RealSense video-index0 exists.
  # For multiple cameras choose the COLOR V4L2 by-id path on the host.
  device: ""
  warmup_seconds: 3
  min_contrast: 8
ros:
  robot_domain_id: 42
  core_domain_id: 42
  robot_interface: lo
