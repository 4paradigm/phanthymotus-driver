mcp_port: 15709
robot_interface: eth0
ros_namespace: ""
plugins:
  # Robot-body microphone stream, received from the AS2 audio multicast.
  # This is not an extension-board ALSA capture device.
  mic: {enabled: true, multicast_group: "239.168.123.161", multicast_port: 5555, multicast_interface: eth0}
  speaker: {enabled: true}
  led: {enabled: true}
  camera_rgb: {enabled: true, fps: 10}
  loco: {enabled: true}
  special_motion: {enabled: true}
  state: {enabled: true}
  lidar:
    enabled: true
    # Override only after checking the driver's 15-second lidar diagnostics.
    # source_topics: ["rt/utlidar/cloud_deskewed"]
  controlled_spatial: {enabled: true}
