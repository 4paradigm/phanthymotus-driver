mcp_port: 15709
robot_interface: auto
ros_namespace: ""
plugins:
  loco: {enabled: true}
  # Continuous motus.control/1 twist input used by ActuCore navigation.
  # Starting the container is inert; the card subscribes only when wired and
  # started by a canvas project.
  loco_servo:
    enabled: true
    expected_hz: 10
    # Keep real chassis output disabled until an operator explicitly confirms
    # the transition through loco_servo.config.
    dry_run: true
    rotate_only: false
    require_standing: true
  special_motion: {enabled: true}
  mic:
    enabled: true
    group: "239.168.123.161"
    port: 5555
    startup_grace_s: 3
    chunk_bytes: 1024
  speaker:
    enabled: true
    block_ms: 300
    startup_prefill_ms: 300
    rebuffer_prefill_ms: 500
    max_lead_ms: 240
  led: {enabled: true}
  camera:
    enabled: true
    backend: videohub
    camera_info:
      # The videohub JPEG stream resolution. Keep these aligned with the frame
      # this card actually publishes so vop can normalise its pixel boxes.
      width: 1920
      height: 1080
      # Measured on the AS2-W with a centred 0.34 m target at 0.254 m.
      # This is the horizontal half-angle; full horizontal FOV is about 122.8°.
      half_fov_rad: 1.072
      source: measured
      measured_on: "nvidia_desktop, 2026-10-16"
    # Moderate 15/12 Hz limits improve navigation responsiveness without jumping
    # straight to the substantially heavier 20-30 Hz range on the Jetson.
    fps: 15
    publish_fps: 12
    max_frame_age_ms: 300
    # Two latest-frame shared-memory slots; increase only if videohub JPEGs exceed 4 MiB.
    max_frame_bytes: 4194304
    rpc_timeout: 1.0
    retry_interval: 2.0
  vision_capture:
    enabled: true
    output_dir: /opt/phanthy-motus/data/vision_capture
    fps: 8
    max_duration_s: 30
  state: {enabled: true}
  lidar:
    enabled: true
    process: true
    max_render_points: 12000
    # Override only after checking the driver's 15-second lidar diagnostics.
    # source_topics: ["rt/utlidar/cloud_deskewed"]
  controlled_spatial: {enabled: true}
  slam_mapping:
    enabled: true
    voxel_size: 0.06
    max_input_points: 20000
    max_map_points: 50000
    max_buffer_points: 200000
