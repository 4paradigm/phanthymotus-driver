mcp_port: 15709
robot_interface: ""
# AS2 body/robot Ethernet subnet; used only to rank automatic interface candidates.
robot_subnet: "192.168.123.0/24"
ros_namespace: ""
plugins:
  # Robot-body microphone stream, received from the AS2 audio multicast.
  # This is not an extension-board ALSA capture device.
  mic: {enabled: true, multicast_group: "239.168.123.161", multicast_port: 5555, multicast_interface: ""}
  # Topic is supplied explicitly by the canvas speaker connection at start.
  speaker: {enabled: true}
  led: {enabled: true}
  camera_rgb: {enabled: true, fps: 10, process: true}
  loco: {enabled: true}
  special_motion: {enabled: true}
  state: {enabled: true}
  lidar:
    enabled: true
    process: true
    max_render_points: 12000
    # Override only after checking the driver's 15-second lidar diagnostics.
    # source_topics: ["rt/utlidar/cloud_deskewed"]
  controlled_spatial: {enabled: true}
