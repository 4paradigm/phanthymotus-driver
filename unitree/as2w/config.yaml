mcp_port: 15709
robot_interface: eth0
ros_namespace: ""
plugins:
  mic: {enabled: true, backend: auto, alsa_device: auto, dds_grace_s: 2}
  speaker: {enabled: true}
  led: {enabled: true}
  camera_rgb: {enabled: true, fps: 5}
  loco: {enabled: true}
  special_motion: {enabled: true}
  state: {enabled: true}
  lidar:
    enabled: true
    # Override only after checking the driver's 15-second lidar diagnostics.
    # source_topics: ["rt/utlidar/cloud_deskewed"]
  controlled_spatial: {enabled: true}
