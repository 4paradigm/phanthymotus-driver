mcp_port: 15701
ros_namespace: ""   # 留空则自动使用 hostname

plugins:
  mic:
    enabled: true
  tts:
    enabled: true
  speaker:
    enabled: true
  led:
    enabled: true
  loco:
    enabled: true
  fall_recovery:
    enabled: true
    fall_angle_threshold_deg: 50
    fall_confirm_duration: 0.5
    foot_force_threshold: 10
    recovery_timeout: 10
    imu_topic: state/imu
    foot_force_topic: loco/state
  continuous_gait:
    enabled: true
  bms_control:
    enabled: true
    command_topic: rt/lf/bmscmd
  arm:
    enabled: true
  state:
    enabled: true
  gripper_state:
    enabled: true
    left_dds_topic: "rt/hand/left_state"
    right_dds_topic: "rt/hand/right_state"
    min_angle_rad: 0.0
    max_angle_rad: 1.5
    grasp_tau_threshold: 0.1
    publish_hz: 20
  gripper_control:
    enabled: true
    left_dds_topic: "rt/hand/left_cmd"
    right_dds_topic: "rt/hand/right_cmd"
    min_angle_rad: 0.0
    max_angle_rad: 1.5
    motor_mode: 10
    default_kp: 20.0
    default_kd: 1.0
    default_force_pct: 50
    max_tau: 0.5
  camera:
    enabled: true
  lidar:
    enabled: true
  slam:
    enabled: false
    map_dir: /opt/phanthy-motus/data/maps
    db_path: /opt/phanthy-motus/data/spatial.db
  controlled_spatial:
    enabled: true
    native_slam_pcd_dir: /home/unitree
    native_slam_db_path: /opt/phanthy-motus/data/controlled_spatial.db
  controlled_spatial_map:
    enabled: true
    native_slam_db_path: /opt/phanthy-motus/data/controlled_spatial.db
  motion_switcher:
    enabled: true
  ext_mic:
    enabled: true
  ext_camera:
    enabled: true

safety_harness:
  enabled: true
  decel_threshold: 2.0
  stop_threshold: 0.8
  lateral_threshold: 0.8
  cone_half_angle: 30
  z_min: 0.1
  z_max: 1.0
  tilt_threshold_deg: 35
  foot_force_min: 10
  foot_airborne_timeout: 0.2
  comm_timeout: 0.5
  motor_temp_decel: 75
  motor_temp_stop: 85
