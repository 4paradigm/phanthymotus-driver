mcp_port: 15701
ros_namespace: ""   # 留空则自动使用 hostname

plugins:
  mic:
    enabled: true
  tts:
    enabled: true
  speaker:
    enabled: true
    isolated_process: true
  led:
    enabled: true
  loco:
    enabled: true
  arm:
    enabled: true
  # 双臂 + 双夹爪的连续控制（motus.control/1，16 维）。给执行模型用。
  #
  # **默认关闭。** 它走 rt/arm_sdk 直接写关节指令，与内置控制器通过混合权重共存
  # （无需调试模式），但它仍然是这个驱动里唯一直接驱动电机的东西。开之前读一遍
  # servo.py 的模块文档，尤其是交还渐出那一段。
  servo:
    enabled: false
    # 指令流频率上限 50；descriptor 的 max_delta_per_step 按它算。
    expected_hz: 30
    # 没装 Dex1 夹爪就设 false —— 那会让这张卡**声明成 14 维**，于是 16 维的模型
    # 协商失败，而不是被执行一半。
    grippers: true
  state:
    enabled: true
  camera:
    enabled: true
  vision_capture:
    enabled: true
    # The existing host bind mount preserves captures across container updates.
    output_dir: /opt/phanthy-motus/data/vision_capture
    fps: 15
    max_duration_s: 30
  lidar:
    enabled: true
  slam:
    enabled: false
    map_dir: /opt/phanthy-motus/data/maps
    db_path: /opt/phanthy-motus/data/spatial.db
  controlled_spatial:
    enabled: true
    isolated_process: true
    native_slam_pcd_dir: /home/unitree
    native_slam_db_path: /opt/phanthy-motus/data/controlled_spatial.db
  controlled_spatial_map:
    enabled: true
    native_slam_db_path: /opt/phanthy-motus/data/controlled_spatial.db
  motion_switcher:
    enabled: true
  ext_mic:
    enabled: true
  ext_camera:
    enabled: true

safety_harness:
  enabled: true
  decel_threshold: 2.0
  stop_threshold: 0.8
  lateral_threshold: 0.8
  cone_half_angle: 30
  z_min: 0.1
  z_max: 1.0
  tilt_threshold_deg: 35
  foot_force_min: 10
  foot_airborne_timeout: 0.2
  comm_timeout: 0.5
  motor_temp_decel: 75
  motor_temp_stop: 85
