mcp_port: 15701
ros_namespace: ""   # 留空则自动使用 hostname

plugins:
  mic:
    enabled: true
  tts:
    enabled: true
  speaker:
    enabled: true
    isolated_process: true
  led:
    enabled: true
  loco:
    enabled: true
  arm:
    enabled: true
  # 双臂 + 双夹爪的连续控制（motus.control/1，16 维）。给执行模型用。
  #
  # **默认关闭。** 它走 rt/arm_sdk 直接写关节指令，与内置控制器通过混合权重共存
  # （无需调试模式），但它仍然是这个驱动里唯一直接驱动电机的东西。开之前读一遍
  # servo.py 的模块文档，尤其是交还渐出那一段。
  servo:
    enabled: false
    # 指令流频率上限 50；descriptor 的 max_delta_per_step 按它算。
    expected_hz: 30
    # 没装 Dex1 夹爪就设 false —— 那会让这张卡**声明成 14 维**，于是 16 维的模型
    # 协商失败，而不是被执行一半。
    grippers: true
  # 双臂**末端位姿**的连续控制（motus.control/1，19 维），在本机解 IK。
  #
  # 和 servo 是两个动作空间，不是一张卡片的两种模式：servo 收关节角，这张收绝对
  # 末端位姿。云端把模型的私有布局规范化成这个标准空间，机器人这边解 IK。
  #
  # **默认关闭，而且它一次真机都没跑过。** 除了 servo 的那些理由，还多两条：腰的
  # roll/pitch 能不能经 arm_sdk 写没有依据（限位已经卡死在 ±0.02 rad），以及
  # CLIK 的姿态跟踪没有在真机上量过。真机验证按官方文档：**先把 G1 悬挂起来，
  # 进锁定站立**。
  servo_eef:
    enabled: false
    expected_hz: 30
    grippers: true
    # 腰「收下但不执行」。**默认 true，因为默认 false 在 1 自由度腰的 G1 上等于
    # 这张卡完全不能用**：模型输出的腰 roll 恒在 0.087–0.148 rad（实测
    # unifolm-vla-g1，换四组完全不同的输入再问没有一次接近零），而 roll/pitch 的
    # 电机 mode=0、限位卡死在 ±0.02，于是每一条指令都在硬限位处被**整条**拒掉 ——
    # 25 步全拒，连 IK 都到不了。
    #
    # 设成 true 之后腰不会被驱动，IK 改挂**实测**腰角（不是指令腰角 —— 挂指令值
    # 才是危险的那个，那会让 IK 按一个机器人到不了的躯干姿态解手臂，每拍差同样
    # 一点，看起来像标定问题）。末端位姿是绝对的，所以手照样去被指令的地方；真要
    # 因此够不着，IK 残差会响亮地拒。
    #
    # **这不是单方面丢三维**：模型必须在 capabilities 的 control_groups 里把腰
    # 声明成 `optional`，否则协商直接拒绝启动。两道一起才让丢维是双方同意过的。
    #
    # 三个轴都在的 29dof 上设 false，腰就会被真的驱动。设错的方向会被机器人当场
    # 证伪：`_start` 探到型号后对不上就拒绝启动。
    waist_advisory: true
    # 解出来的位姿离目标多远就拒绝并保持。这是唯一让「解不出来」变成响亮失败的
    # 地方 —— 迭代法不收敛时返回的是某个关节角，不是异常。
    max_position_residual: 0.01     # m
    max_rotation_residual: 0.05     # rad
  state:
    enabled: true
  camera:
    enabled: true
  vision_capture:
    enabled: true
    # The existing host bind mount preserves captures across container updates.
    output_dir: /opt/phanthy-motus/data/vision_capture
    fps: 15
    max_duration_s: 30
  lidar:
    enabled: true
  slam:
    enabled: false
    map_dir: /opt/phanthy-motus/data/maps
    db_path: /opt/phanthy-motus/data/spatial.db
  controlled_spatial:
    enabled: true
    isolated_process: true
    native_slam_pcd_dir: /home/unitree
    native_slam_db_path: /opt/phanthy-motus/data/controlled_spatial.db
  controlled_spatial_map:
    enabled: true
    native_slam_db_path: /opt/phanthy-motus/data/controlled_spatial.db
  motion_switcher:
    enabled: true
  ext_mic:
    enabled: true
  ext_camera:
    enabled: true

safety_harness:
  enabled: true
  decel_threshold: 2.0
  stop_threshold: 0.8
  lateral_threshold: 0.8
  cone_half_angle: 30
  z_min: 0.1
  z_max: 1.0
  tilt_threshold_deg: 35
  foot_force_min: 10
  foot_airborne_timeout: 0.2
  comm_timeout: 0.5
  motor_temp_decel: 75
  motor_temp_stop: 85
