mcp_port: 15701
ros_namespace: ""   # 留空则自动使用 hostname

plugins:
  mic:
    enabled: true
  tts:
    enabled: true
  speaker:
    enabled: true
  led:
    enabled: true
  loco:
    enabled: true
  fall_recovery:
    enabled: true
    fall_angle_threshold_deg: 50
    fall_confirm_duration: 0.5
    foot_force_threshold: 10
    recovery_timeout: 10
    imu_topic: state/imu
    foot_force_topic: loco/state
  continuous_gait:
    enabled: true
  bms_control:
    enabled: true
    command_topic: rt/lf/bmscmd
  arm:
    enabled: true
  arm_trajectory:
    enabled: true
    lowcmd_topic: "rt/lowcmd"
    lowstate_topic: "rt/lowstate"
    motor_mode: 10
    default_kp: 20.0
    default_kd: 1.0
    control_freq_hz: 50
  state:
    enabled: true
  head_control:
    enabled: true
    motor_index: 23           # 头部电机索引，待真机确认
    min_angle_deg: -90.0      # 最小角度（左）
    max_angle_deg: 90.0       # 最大角度（右）
    motor_mode: 10            # 位置控制模式，待确认
    default_kp: 20.0
    default_kd: 1.0
    lowcmd_topic: "rt/lowcmd"
    lowstate_topic: "rt/lowstate"
    shake_amplitude_deg: 30.0
    shake_speed_hz: 1.5
    shake_times: 3
  waist_control:
    enabled: true
    motor_index: 12           # 腰部电机索引，待真机确认
    min_angle_deg: -180.0     # 最小角度，待确认
    max_angle_deg: 180.0      # 最大角度，待确认
    motor_mode: 10            # 位置控制模式，待确认
    default_kp: 20.0
    default_kd: 1.0
    lowcmd_topic: "rt/lowcmd"
    lowstate_topic: "rt/lowstate"
    shake_amplitude_deg: 45.0
    shake_speed_hz: 1.0
    shake_times: 3
  camera:
    enabled: true
  lidar:
    enabled: true
  slam:
    enabled: false
    map_dir: /opt/phanthy-motus/data/maps
    db_path: /opt/phanthy-motus/data/spatial.db
  controlled_spatial:
    enabled: true
    native_slam_pcd_dir: /home/unitree
    native_slam_db_path: /opt/phanthy-motus/data/controlled_spatial.db
  controlled_spatial_map:
    enabled: true
    native_slam_db_path: /opt/phanthy-motus/data/controlled_spatial.db
  motion_switcher:
    enabled: true
  ext_mic:
    enabled: true
  ext_camera:
    enabled: true

safety_harness:
  enabled: true
  decel_threshold: 2.0
  stop_threshold: 0.8
  lateral_threshold: 0.8
  cone_half_angle: 30
  z_min: 0.1
  z_max: 1.0
  tilt_threshold_deg: 35
  foot_force_min: 10
  foot_airborne_timeout: 0.2
  comm_timeout: 0.5
  motor_temp_decel: 75
  motor_temp_stop: 85
