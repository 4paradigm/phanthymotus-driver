mcp_port: 15701
ros_namespace: ""   # 留空则自动使用 hostname

plugins:
  mic:
    enabled: true
  tts:
    enabled: true
  speaker:
    enabled: true
  led:
    enabled: true
  loco:
    enabled: true
  arm:
    enabled: true
  state:
    enabled: true
  posture_safety:
    enabled: true
    publish_hz: 10
    warning_tilt_deg: 25
    danger_tilt_deg: 45
    fallen_tilt_deg: 65
    angular_speed_warning_rad_s: 2.5
    angular_speed_danger_rad_s: 5.0
    impact_accel_mps2: 18.0
    stale_timeout_sec: 1.0
  camera:
    enabled: true
  lidar:
    enabled: true
  slam:
    enabled: false
    map_dir: /opt/phanthy-motus/data/maps
    db_path: /opt/phanthy-motus/data/spatial.db
  controlled_spatial:
    enabled: true
    native_slam_pcd_dir: /home/unitree
    native_slam_db_path: /opt/phanthy-motus/data/controlled_spatial.db
  controlled_spatial_map:
    enabled: true
    native_slam_db_path: /opt/phanthy-motus/data/controlled_spatial.db
  motion_switcher:
    enabled: true
  ext_mic:
    enabled: true
  ext_camera:
    enabled: true

safety_harness:
  enabled: true
  decel_threshold: 2.0
  stop_threshold: 0.8
  lateral_threshold: 0.8
  cone_half_angle: 30
  z_min: 0.1
  z_max: 1.0
  tilt_threshold_deg: 35
  foot_force_min: 10
  foot_airborne_timeout: 0.2
  comm_timeout: 0.5
  motor_temp_decel: 75
  motor_temp_stop: 85
