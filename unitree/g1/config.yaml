mcp_port: 15701
ros_namespace: ""   # 留空则自动使用 hostname

plugins:
  mic:
    enabled: true
  tts:
    enabled: true
    # Native speak is hidden while strict Speaker completion is enabled;
    # volume control remains available. If Speaker is changed to estimated,
    # set this to true explicitly to restore native synthesis.
    speak_enabled: false
  speaker:
    enabled: true
    # G1 body-speaker firmware publishes {"play_state":1|0} on this DDS topic.
    # Strict mode reports completed only after the matching playing -> idle cycle.
    completion_mode: hardware_state
    play_state_topic: rt/audio_msg
    play_state_discovery_timeout_sec: 3.0
    play_state_timeout_sec: 2.0
  led:
    enabled: true
  loco:
    enabled: true
  arm:
    enabled: true
  state:
    enabled: true
  camera:
    enabled: true
  lidar:
    enabled: true
  slam:
    enabled: false
    map_dir: /opt/phanthy-motus/data/maps
    db_path: /opt/phanthy-motus/data/spatial.db
  controlled_spatial:
    enabled: true
    native_slam_pcd_dir: /home/unitree
    native_slam_db_path: /opt/phanthy-motus/data/controlled_spatial.db
  controlled_spatial_map:
    enabled: true
    native_slam_db_path: /opt/phanthy-motus/data/controlled_spatial.db
  motion_switcher:
    enabled: true
  ext_mic:
    enabled: true
  ext_camera:
    enabled: true

safety_harness:
  enabled: true
  decel_threshold: 2.0
  stop_threshold: 0.8
  lateral_threshold: 0.8
  cone_half_angle: 30
  z_min: 0.1
  z_max: 1.0
  tilt_threshold_deg: 35
  foot_force_min: 10
  foot_airborne_timeout: 0.2
  comm_timeout: 0.5
  motor_temp_decel: 75
  motor_temp_stop: 85
