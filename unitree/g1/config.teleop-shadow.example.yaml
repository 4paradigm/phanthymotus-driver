mcp_port: 15701
ros_namespace: ""

plugins:
  mic:
    enabled: true
  tts:
    enabled: true
  speaker:
    enabled: true
  led:
    enabled: true
  loco:
    enabled: true
  # ArmActionPlugin and teleoperation are exclusive arm authorities.
  arm:
    enabled: false
  state:
    enabled: true
  camera:
    enabled: true
  lidar:
    enabled: true
  slam:
    enabled: false
    map_dir: /opt/phanthy-motus/data/maps
    db_path: /opt/phanthy-motus/data/spatial.db
  controlled_spatial:
    enabled: true
    native_slam_pcd_dir: /home/unitree
    native_slam_db_path: /opt/phanthy-motus/data/controlled_spatial.db
  controlled_spatial_map:
    enabled: true
    native_slam_db_path: /opt/phanthy-motus/data/controlled_spatial.db
  motion_switcher:
    enabled: true
  ext_mic:
    enabled: true
  ext_camera:
    enabled: true

safety_harness:
  enabled: true
  decel_threshold: 2.0
  stop_threshold: 0.8
  lateral_threshold: 0.8
  cone_half_angle: 30
  z_min: 0.1
  z_max: 1.0
  tilt_threshold_deg: 35
  foot_force_min: 10
  foot_airborne_timeout: 0.2
  comm_timeout: 0.5
  motor_temp_decel: 75
  motor_temp_stop: 85

teleop:
  enabled: true
  mode: shadow
  profile_id: unitree_g1_23_dual_arm_controller_v1
  mode_machine: 4
  base_enabled: false
  hands_enabled: false
  lease_timeout_ms: 1000
  pose_timeout_ms: 200
  watchdog_interval_ms: 25
  dispatch_io_timeout_ms: 150
  dispatch_ack_timeout_ms: 200
  capture:
    bind_host: 0.0.0.0
    port: 15702
    # Must exactly match a DNS/IP SAN in the dedicated Capture certificate.
    public_wss_url: wss://10.110.12.110:15702/ws/teleop-capture
    tls_cert_file: /etc/motus-g1-capture-tls/cert.pem
    tls_key_file: /etc/motus-g1-capture-tls/key.pem
    state_file: /var/lib/motus-g1-teleop/capture.json
    pairing_ttl_seconds: 60
    presence_interval_ms: 1000
    presence_timeout_ms: 5000
    ticket_ttl_seconds: 20
  live:
    enabled: false
    control_hz: 250
    ramp_seconds: 2.0
    release_seconds: 0.05
    velocity_limit_rad_s: 0.5
    command_timeout_seconds: 0.2
  registration:
    agent_core_url: https://localhost:15678
    advertise_url: http://localhost:15701/mcp
    verify_tls: true
    ca_file: /etc/motus-core-certs/cert.pem
