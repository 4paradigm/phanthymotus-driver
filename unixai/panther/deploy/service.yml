unixai-panther:
  image: __IMAGE__
  container_name: embodied-unixai-panther
  network_mode: host
  pid: host
  privileged: true
  volumes:
    - /opt/phanthy-motus/dds-local.xml:/opt/phanthy-motus/dds-local.xml:ro
    - /opt/phanthy-motus/data:/opt/phanthy-motus/data
    # Panther's host ROS graph is intentionally confined to loopback. With
    # network_mode: host the container shares that loopback, but it must load
    # the same CycloneDDS profile or it selects another interface and forms a
    # separate domain-0 graph.
    - /home/unix_ai/config/cyclonedds.xml:/etc/cyclonedds/panther.xml:ro
    - /run/user/1001/pulse:/run/user/1001/pulse
    - ${PANTHER_PULSE_COOKIE_PATH:-/home/unix_ai/.config/pulse/cookie}:/run/panther-pulse-cookie:ro
  environment:
    - PANTHER_ROS_DOMAIN_ID=0
    - AGENT_CORE_ROS_DOMAIN_ID=42
    - PANTHER_MCP_ADVERTISE_HOST=${PANTHER_MCP_ADVERTISE_HOST:-localhost}
    - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    - CYCLONEDDS_URI=file:///etc/cyclonedds/panther.xml,file:///work/resource/cyclonedds-muzzle.xml
    - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/phanthy-motus/dds-local.xml
    - PULSE_SERVER=unix:/run/user/1001/pulse/native
    - PULSE_COOKIE=/run/panther-pulse-cookie
    - PANTHER_PULSE_UID=${PANTHER_PULSE_UID:-1001}
    - PANTHER_PULSE_GID=${PANTHER_PULSE_GID:-1002}
    - PANTHER_PULSE_SOURCE=${PANTHER_PULSE_SOURCE:-alsa_input.platform-sound.analog-stereo}
    - PANTHER_PULSE_SINK=${PANTHER_PULSE_SINK:-alsa_output.platform-sound.analog-stereo}
    - PYTHONUNBUFFERED=1
    - RCUTILS_COLORIZED_OUTPUT=0
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  # Allow camera workers and the isolated Agent Core bridge to stop cleanly.
  stop_grace_period: 30s
  restart: always

