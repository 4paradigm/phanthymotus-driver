name: "UniX AI Panther Bundle"
mcp_port: 15792
ros_namespace: "unixai_panther"

ros:
  robot_domain_id: 0
  core_domain_id: 42
  robot_rmw: "rmw_cyclonedds_cpp"

plugins:
  joints: {enabled: true}
  robot_state: {enabled: true}
  battery: {enabled: true}
  imu: {enabled: true}
  odom: {enabled: true}
  laser_scan: {enabled: true}

  camera:
    workspace: "/home/unix_ai/orbbec_ws"
    cyclonedds_profile: "/home/unix_ai/config/cyclonedds.xml"
    startup_timeout_s: 30.0
    first_frame_grace_s: 30.0
    frame_stall_s: 15.0
    max_watchdog_restarts: 2
    rgb_hz: 10.0
    depth_hz: 8.0
    jpeg_quality: 70
    max_width: 640
  camera_color: {enabled: true}
  camera_depth: {enabled: true}

  audio:
    server: "unix:/run/user/1001/pulse/native"
    uid: 1001
    gid: 1002
    # Confirm physical routing on Panther before changing these names.
    source: "alsa_input.platform-sound.analog-stereo"
    sink: "alsa_output.platform-sound.analog-stereo"
  mic: {enabled: true}
  speaker: {enabled: true}

  base_drive:
    enabled: true
    # Operator-approved working caps; ROS receives angular velocity in radians/s.
    # Prefer the SDK topic; retain the deployed teleop topic as a fallback.
    cmd_topics: ["/cmd_vel", "/cmd_vel_teleop"]
    max_linear_mps: 0.50
    max_angular_deg_s: 45.0
    max_duration_s: 10.0
    publish_rate_hz: 20.0
    stop_repetitions: 5
    stop_publish_duration_s: 1.0
    stop_match_timeout_s: 3.0
  arm_control:
    enabled: true
    max_duration_s: 20.0
    min_duration_s: 1.0
    speed_deg_s: 20.0
    # Per-command joint-step cap; URDF hard limits are always enforced too.
    max_target_delta_deg: 20.0
    # Only implicit hold targets may absorb this much encoder/zero-point noise;
    # explicit user targets remain strictly bounded by the vendor URDF.
    hold_limit_tolerance_deg: 0.5
    # PR 521-compatible candidate pose; the ordinary per-command delta gate
    # remains mandatory until this target is independently hardware-verified.
    home_pose_deg:
      joint_la0: 0.0
      joint_la1: 0.0
      joint_la2: 0.0
      joint_la3: 0.0
      joint_la4: 0.0
      joint_la5: 0.0
      joint_la6: 0.0
      joint_la7: 0.0
      joint_ra0: 0.0
      joint_ra1: 0.0
      joint_ra2: 0.0
      joint_ra3: 0.0
      joint_ra4: 0.0
      joint_ra5: 0.0
      joint_ra6: 0.0
      joint_ra7: 0.0
  gripper:
    enabled: true
    open_position: 0.0
    closed_position: 1.0
  lifting:
    enabled: true
    min_position_m: 0.0
    max_position_m: 0.8
    home_position_m: 0.6
  head:
    enabled: true
    yaw_min_deg: -90.0
    yaw_max_deg: 90.0
    pitch_min_deg: -86.0
    pitch_max_deg: 20.0
    high_speed_deg_s: 20.0
    low_speed_deg_s: 10.0
    publish_rate_hz: 20.0
    # Runtime-verified channel order: yaw -> joint_head0, pitch -> joint_head1.
    home_pose_deg: {yaw_deg: 0.0, pitch_deg: 0.0}

  # Continuous 50 Hz arm servo remains disabled until watchdog/hold behavior
  # has been measured on Panther hardware.
  servo: {enabled: false}

