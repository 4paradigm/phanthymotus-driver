id: unixai-panther-driver
name: UniX AI Panther Bundle
category: driver
hardware_provider: unixai
hardware_model: panther
image_name: unixai-panther
port: 15792
mcp_url: "http://localhost:15792/mcp"
description: "UniX AI Panther mobile manipulator — joints, robot and battery state, IMU, odometry, live lidar, lazy RGB-D camera, photo and video capture, microphone, speaker, omnidirectional base, dual-arm P2P, grippers, lifting, head, controlled SLAM mapping, tagged navigation and map display"
build_context_extras:
  - ../../common
cards:
  - {name: joints, type: sensor}
  - {name: model, type: resource}
  - {name: robot_state, type: sensor}
  - {name: battery, type: sensor}
  - {name: imu, type: sensor}
  - {name: odom, type: sensor}
  - {name: laser_scan, type: sensor}
  - {name: camera_color, type: sensor}
  - {name: camera_depth, type: sensor}
  - {name: camera_left, type: sensor}
  - {name: camera_right, type: sensor}
  - {name: vision_capture, type: actuator}
  - {name: mic, type: sensor}
  - {name: speaker, type: actuator}
  - {name: base_drive, type: actuator}
  - {name: base_servo, type: actuator}
  - {name: arm_control, type: actuator}
  - {name: gripper, type: actuator}
  - {name: lifting, type: actuator}
  - {name: head, type: actuator}

  - {name: controlled_spatial, type: actuator}
  - {name: spatial_map, type: actuator}
