  joint_states: "/joint_states"
  arm_state_cmd: "/rm_driver/get_current_arm_state_cmd"
  arm_state: "/rm_driver/get_current_arm_state_result"
  arm_original_state: "/rm_driver/get_current_arm_original_state_result"
  arm_current_status: "/rm_driver/udp_arm_current_status"
  joint_error: "/rm_driver/udp_joint_error_code"
  rm_error: "/rm_driver/udp_rm_err"
  movej_cmd: "/rm_driver/movej_cmd"
  movej_result: "/rm_driver/movej_result"
  move_stop_cmd: "/rm_driver/move_stop_cmd"
  move_stop_result: "/rm_driver/move_stop_result"
  joint_error_clear_cmd: "/rm_driver/set_joint_err_clear_cmd"
  joint_error_clear_result: "/rm_driver/set_joint_err_clear_result"
