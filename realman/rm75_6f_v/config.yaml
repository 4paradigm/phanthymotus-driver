mcp_port: 15718
ros_namespace: ""
name: "睿尔曼 RM75-6F-V"
arm_dof: 7
arm_ip: "192.168.1.18"
tcp_port: 8080
safety:
  require_fresh_joint_state: true
  require_no_errors: true
  max_state_age_seconds: 2.0
  max_result_wait_seconds: 10.0
  joint_target_tolerance_rad: 0.01
  movej_blend_radius: 0
