hardware_model: tron2-edu
image_name: limx-tron2-edu
port: 15740
mcp_url: http://localhost:15740/mcp
description: "TRON 2 EDU upper-level SDK: configuration-aware telemetry and leased leg/wheel velocity. Arm motion pending vendor interrupt contract."
build_context_extras:
