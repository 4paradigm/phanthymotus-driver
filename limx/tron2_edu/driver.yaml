  - {name: tron2_robot_info, type: sensor}
  - {name: tron2_joint_states, type: sensor}
  - {name: tron2_eef_pose, type: sensor}
  - {name: tron2_arm_target, type: sensor}
  - {name: tron2_velocity, type: actuator}
