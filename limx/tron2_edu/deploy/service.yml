limx-tron2-edu:
  container_name: embodied-limx-tron2-edu
  image: __IMAGE__
  network_mode: host
  volumes:
    - /opt/phanthy-motus/dds-local.xml:/opt/phanthy-motus/dds-local.xml:ro
    - ${TRON2_CONFIG_PATH:-/opt/phanthy-motus/config/tron2.yaml}:/work/config.yaml:ro
  environment:
    - ROS_DOMAIN_ID=42
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/phanthy-motus/dds-local.xml
    - ROS_LOCALHOST_ONLY=0
    - PYTHONUNBUFFERED=1
    - AGENT_CORE_URL=${AGENT_CORE_URL:-https://localhost:15678}
  restart: always
