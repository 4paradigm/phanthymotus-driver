id: limx-tron2-driver
name: LimX TRON2 Robot Driver
category: driver
hardware_provider: limx
hardware_model: tron2
image_name: limx-tron2
port: 15791
mcp_url: "http://localhost:15791/mcp"
description: "TRON2 构型识别、电池、原生骨架、下肢轮足运动、双臂与头部伺服，以及现有相机、预设动作、夹爪和人物跟随"
build_context_extras:
  - ../../common
cards:
  - {name: loco_servo_arm, type: actuator}
  - {name: loco_leg, type: actuator}
  - {name: battery, type: sensor}
  - {name: joints, type: sensor}
  - {name: camera, type: sensor}
  - {name: camera_left, type: sensor}
  - {name: camera_right, type: sensor}
  - {name: arm_control, type: actuator}
  - {name: pose, type: actuator}
  - {name: move_head, type: actuator}
  - {name: gripper, type: actuator}
  - {name: model, type: resource}
  - {name: head_visual_follow, type: actuator}
