mcp_port: 15791
robot:
  url: ws://10.192.1.2:5000
  # Optional identity lock. Blank learns the first notified serial for this process.
  serial: ""
  poll_interval_seconds: 0.5
  response_timeout_seconds: 5
  stale_after_seconds: 5
plugins:
  joint_state: {enabled: true}
  robot_status: {enabled: true}
  battery_state: {enabled: true}
