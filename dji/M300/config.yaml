mcp_port: 15702
ros_namespace: ""   # 留空则自动使用 hostname
name: "DJI Matrice 300 RTK"

# PSDK bridge settings
psdk_bridge:
  app_name: "PhanthyMotus"
  app_id: "190076"
  app_key: "26af38fb6126f58c195b5c8da0b481c"
  app_license: ""
  # The M300 OSDK board is the DJI USB CDC device (VID:PID 2ca3:001f).
  # ttyUSB0..ttyUSB3 belong to the Quectel modem (2c7c:0800), not the drone.
  uart0_dev: "/dev/ttyACM0"
  uart0_baud_rate: 921600
  uart1_dev: "/dev/ttyACM0"

plugins:
  telemetry:
    enabled: true
    publish_rate: 10   # Hz
  camera_stream:
    enabled: true
    fps: 10
    # M300 uses the currently mounted payload on port 1 (for example H20/H20T).
    camera_source: "default"
  perception:
    enabled: true
  hms:
    enabled: true
  flight:
    enabled: true
  camera:
    enabled: true
  gimbal:
    enabled: true
  waypoint:
    # The migrated Mavic implementation emits Waypoint V3/KMZ, which DJI only
    # supports on M30/Mavic 3-series. M300 requires a native Waypoint V2
    # mission builder, so do not expose an unsafe, incompatible card.
    enabled: false
  time_sync:
    enabled: true
