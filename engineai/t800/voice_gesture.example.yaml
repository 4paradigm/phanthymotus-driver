# 复制 config.yaml 为单独的 config.voice-gesture.yaml 后，将本段加入 plugins:。
# 原 config.yaml 和已有插件实现均不需要修改。
voice_gesture:
  enabled: true
  # 空值时，默认订阅 /{ros_namespace}/mic/audio/asr。
  # 若 ros_namespace 留空，建议在部署配置中显式填写实际 Perception ASR 输出 Topic。
  asr_topic: ""
  require_wake_word: true
  cooldown_sec: 3.0
  # 将众擎官方 ROS2 workspace 的 config/t800 目录只读挂载到此路径。
  # 未挂载时，镜像内置的 motion_plan_shake_hand.yaml 会作为握手动作的回退配置。
  motion_dir: /official-motions
  planner_ready_timeout_sec: 10.0
  planner_step_timeout_sec: 15.0

  # ASR 文本只能选择官方 T800 姿势 YAML，不能直接指定任意关节或参数。
  motions:
    wave:
      description: "举手挥手打招呼"
      phrases: ["你好", "您好", "打招呼"]
      file: motion_plan_wave_hands.yaml
    shake_hand:
      description: "伸手握手"
      phrases: ["握手", "握个手"]
      file: motion_plan_shake_hand.yaml
