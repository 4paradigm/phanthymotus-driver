# T800 容器 ALSA 路由：默认 PCM 经 PulseAudio（宿主音频服务）
#
# 依据众擎飞书《ROS2 接口开发文档》第8章：回放走 aplay、系统音量走 pactl。
# 只有把 ALSA 默认设备路由到 PulseAudio，pactl 音量才会作用于 aplay 的
# 播放输出；同时 PulseAudio tsched 低延迟调度（PULSE_LATENCY_MSEC）替代
# ALSA dmix 默认 16384 帧（~341ms）大缓冲，保证 remote_mic 等画布音频源
# 的实时播放。
pcm.!default {
    type pulse
    hint.description "T800 speaker via host PulseAudio"
}

ctl.!default {
    type pulse
}
