id: ubtrobot-u1-pro-driver
name: UBTECH U1 Pro Driver
category: driver
hardware_provider: ubtrobot
hardware_model: "u1_pro"
image_name: ubtrobot-u1-pro
port: 15723
mcp_url: "http://localhost:15723/mcp"
description: "UBTECH U1 Pro microphone, live speaker PCM, preset audio/motion playback, wakeup events, and sound direction"
build_context_extras:
  - ../../common
cards:
  - { name: auth, type: actuator }
  - { name: mic, type: sensor }
  - { name: speaker, type: actuator }
  - { name: audio, type: actuator }
  - { name: playback_state, type: sensor }
  - { name: main_wakeup_word, type: sensor }
  - { name: wakeup_event, type: sensor }
  - { name: wakeup_state, type: sensor }
  - { name: doa_event, type: sensor }
