mcp_port: 15740
ros_namespace: ""
audio:
  # Maximum speech-only make-up gain. Steady background is learned and reduced.
  # Override with U1_PRO_MIC_GAIN_DB at deployment.
  mic_gain_db: 18.0
idle_actions:
  # ROSA config client runs in the existing vendor container; no SDK idle endpoint.
  # Only used by idle_actions. Driver/card lifecycle preserves this preference.
  native_container: walker-behavior.behavior-1
ros:
  # Vendor control, authorization, TTS, and motion services run on domain 20.
  robot_domain_id: 20
  # Device audio and physical-eye camera topics in the vendor Adapter run on domain 2.
  audio_device_domain_id: 2
  core_domain_id: 42
  # The Adapter's vendor graph uses localhost; device streams use domain 2.
  robot_interface: "lo"
  cyclonedds_uri: "<CycloneDDS><Domain><General><Interfaces><NetworkInterface name='lo'/></Interfaces><AllowMulticast>false</AllowMulticast></General><Discovery><ParticipantIndex>auto</ParticipantIndex><Peers><Peer Address='127.0.0.1'/></Peers><MaxAutoParticipantIndex>200</MaxAutoParticipantIndex></Discovery><Tracing><Verbosity>severe</Verbosity><OutputFile>/dev/null</OutputFile></Tracing></Domain></CycloneDDS>"
sound_direction:
  # Independent vendor DOA worker on domain 43. No wakeup/behavior switches.
  # Install it using deploy/native_doa_manage.py before starting this backend.
  source: native
  activity:
    # Operator-selected B baseline, not acoustic SPL. Quiet startup ~1 second.
    minimum_dbfs: -65.0
    margin_db: 2.5
  frame_compensation:
    enabled: true
    # Initial physical sign assumption, to be accepted by the operator.
    yaw_sign: 1
    zero_offset_deg: 0.0
