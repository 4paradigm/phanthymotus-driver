mcp_port: 15740
ros_namespace: ""
ros:
  robot_domain_id: 2
  core_domain_id: 42
  # rgmii0 is the U1 robot-side Ethernet interface on the target platform.
  # It supports multicast discovery; loopback does not.
  robot_interface: "rgmii0"
  cyclonedds_uri: "<CycloneDDS><Domain><General><Interfaces><NetworkInterface name='rgmii0'/></Interfaces><AllowMulticast>true</AllowMulticast></General><Tracing><Verbosity>severe</Verbosity><OutputFile>/dev/null</OutputFile></Tracing></Domain></CycloneDDS>"
vision_capture:
  output_dir: "/opt/phanthy-motus/data/vision_capture/u1_pro"
  video_fps: 15
  default_video_seconds: 5
  max_video_seconds: 60
