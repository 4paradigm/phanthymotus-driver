mcp_port: 15708
ros_namespace: ""   # 留空则自动使用 hostname
name: "XBot-Q5"
joint_state_position_unit: "radians"

plugins:
  state:
    enabled: true
  base_drive:
    enabled: true
    max_linear_x_mps: 0.20
    max_angular_z_radps: 0.40
    max_duration_s: 2.0
    publish_rate_hz: 10.0
    stop_repetitions: 3
  q5_control_mode:
    enabled: true
  arm_control:
    enabled: true
    max_step_rad: 0.010
    publish_rate_hz: 20.0
    hold_repetitions: 3
  hand_control:
    enabled: true
    min_position_rad: 0.0
    max_position_rad: 1.0
    max_step_rad: 0.04
    max_duration_s: 2.0
    publish_rate_hz: 20.0
    hold_repetitions: 3
  hand_gesture:
    enabled: true
    max_duration_s: 2.0
    publish_rate_hz: 20.0
  head_control:
    enabled: true
    max_step_rad: 0.025
    publish_rate_hz: 20.0
    hold_repetitions: 3
  audio:
    enabled: true  # 已确认 /audio_player/play (AudioPlay) 及配套服务存在
    device: "plughw:2,0"
  battery:
    enabled: true
  mic:
    enabled: true
    # Discover the Q5 POROSVOC USB capture card by ALSA name. PortAudio's
    # device indices are unreliable in the developer container.
    device: auto
    sample_rate_hz: 16000
    channels: 1
  speaker:
    enabled: true
    # The canvas supplies the connected audio/pcm-16k source topic when the
    # speaker starts. This accepts microphone, TTS, and any compatible source.
    # Verified hardware ALSA endpoint. PortAudio cannot enumerate it as an
    # output device in Q5's developer container, so speaker uses ALSA directly.
    device: "hw:2,0"
    sample_rate_hz: 16000
    channels: 1
    # Hardware probe verified 44.1/48 kHz stereo; the card converts the shared
    # 16 kHz mono TTS contract at the final playback boundary.
    output_sample_rate_hz: 44100
    output_channels: 2
  camera_rgb:
    enabled: true
    source_topic: "/camera/camera/color/image_raw"
    max_hz: 15.0
    jpeg_quality: 60
    remote_start:
      # Q5 D455 is physically connected to the developer container. The Q5
      # driver starts it automatically through the vendor's documented fixed
      # developer account; no interactive SSH login is required on deploy.
      enabled: true
      host: "192.168.8.100"
      port: 2222
      user: "developer"
      password: "developer"
      depth_profile: "848x480x30"
      color_profile: "848x480x30"
  camera_depth:
    enabled: true
    source_topic: "/camera/camera/aligned_depth_to_color/image_raw"
    max_hz: 15.0
