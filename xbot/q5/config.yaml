mcp_port: 15708
ros_namespace: ""   # 留空则自动使用 hostname
name: "XBot-Q5"
joint_state_position_unit: "radians"

plugins:
  q5_control_mode:
    enabled: true
  arm_control:
    enabled: true
    max_step_rad: 0.010
    publish_rate_hz: 20.0
    hold_repetitions: 3
  audio:
    enabled: true  # 已确认 /audio_player/play (AudioPlay) 及配套服务存在
    device: "plughw:2,0"
  mic:
    enabled: true
    # Discover the documented full-duplex USB Audio Device by ALSA name.
    # PortAudio's device indices are unreliable in the developer container;
    # POROSVOC remains the fallback capture-only device.
    device: auto
    sample_rate_hz: 16000
    channels: 1
  speaker:
    enabled: true
    # The canvas supplies the connected audio/pcm-16k source topic when the
    # speaker starts. This accepts microphone, TTS, and any compatible source.
    # Verified hardware ALSA endpoint. PortAudio cannot enumerate it as an
    # output device in Q5's developer container, so speaker uses ALSA directly.
    device: "hw:2,0"
    sample_rate_hz: 16000
    channels: 1
    # Hardware probe verified 44.1/48 kHz stereo. 48 kHz is the native stable
    # live-playback setting for the USB speaker; conversion happens only at
    # this final hardware boundary.
    output_sample_rate_hz: 48000
    output_channels: 2
  camera_rgb:
    enabled: true
    source_topic: "/camera/camera/color/image_raw"
    max_hz: 15.0
    jpeg_quality: 60
    remote_start:
      # Q5 D455 is physically connected to the developer container. The Q5
      # driver starts it automatically through the vendor's documented fixed
      # developer account; no interactive SSH login is required on deploy.
      enabled: true
      host: "192.168.8.100"
      port: 2222
      user: "developer"
      password: "developer"
      depth_profile: "848x480x30"
      color_profile: "848x480x30"
  camera_depth:
    enabled: true
    source_topic: "/camera/camera/aligned_depth_to_color/image_raw"
    max_hz: 15.0
