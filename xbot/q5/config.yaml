mcp_port: 15708
ros_namespace: ""   # 留空则自动使用 hostname
name: "XBot-Q5"
joint_state_position_unit: "radians"

plugins:
  state:
    enabled: true
  base_drive:
    enabled: true
    max_linear_x_mps: 0.20
    max_angular_z_radps: 0.40
    max_duration_s: 2.0
    publish_rate_hz: 10.0
    stop_repetitions: 3
  arm_control:
    enabled: true
    max_step_rad: 0.010
    publish_rate_hz: 20.0
    hold_repetitions: 3
  hand_control:
    enabled: true
    min_position_rad: 0.0
    max_position_rad: 1.0
    max_step_rad: 0.04
    max_duration_s: 2.0
    publish_rate_hz: 20.0
    hold_repetitions: 3
  hand_gesture:
    enabled: true
    max_duration_s: 2.0
    publish_rate_hz: 20.0
  head_control:
    enabled: true
    max_step_rad: 0.025
    publish_rate_hz: 20.0
    hold_repetitions: 3
  audio:
    enabled: true  # 已确认 /audio_player/play (AudioPlay) 及配套服务存在
    device: "plughw:2,0"
  battery:
    enabled: true
  mic:
    enabled: true
    device: "default"
    sample_rate_hz: 16000
    channels: 1
  speaker:
    enabled: true
    # Agent Core wires perception TTS's audio/pcm-16k output here. The default
    # also makes a default perception TTS instance work without extra config.
    input_topic: "/perception/tts"
    device: "default"
    sample_rate_hz: 16000
    channels: 1
  camera_rgb:
    enabled: true
    source_topic: "/camera/camera/color/image_raw"
    max_hz: 15.0
    jpeg_quality: 60
    remote_start:
      # Q5 D455 is physically connected to the developer container. The Q5
      # driver starts it automatically through the vendor's documented fixed
      # developer account; no interactive SSH login is required on deploy.
      enabled: true
      host: "192.168.8.100"
      port: 2222
      user: "developer"
      password: "developer"
      depth_profile: "848x480x30"
      color_profile: "848x480x30"
  camera_depth:
    enabled: true
    source_topic: "/camera/camera/aligned_depth_to_color/image_raw"
    max_hz: 15.0
