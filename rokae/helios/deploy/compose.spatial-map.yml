# Apply after the robot's base Compose file.
services:
  rokae-helios:
    volumes:
      - type: bind
        source: ${HELIOS_SDK_PYTHON_DIR:?Set the host directory of the SDK Python 3.12 runtime}
        target: /opt/sdk-python
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${HELIOS_VMR_SDK_DIR:?Set the host directory of the VMR SDK containing lib/}
        target: /opt/vmr-sdk
        read_only: true
        bind: {create_host_path: false}
