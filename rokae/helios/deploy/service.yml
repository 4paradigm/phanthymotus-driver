rokae-helios:
  image: __IMAGE__
  container_name: embodied-rokae-helios
  network_mode: host
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=16m
  # Five colour nodes on the verified Helios host. Identity is checked via sysfs.
  # Do not mount depth/IR nodes, /dev as a whole, or privileged camera controls.
  devices:
    - /dev/video4:/dev/video4:rw
    - /dev/video12:/dev/video12:rw
    - /dev/video16:/dev/video16:rw
    - /dev/video17:/dev/video17:rw
    - /dev/video18:/dev/video18:rw
    # The Tegra VI driver opens a free /dev/capture-vi-channelN by path in the
    # caller's mount namespace when streaming starts; without these nodes the
    # stream starts but never delivers a frame (dmesg: err -2). Kernel picks the
    # channel, so all 72 VI channel nodes are mapped. ISP channels are not needed.
    - /dev/capture-vi-channel0:/dev/capture-vi-channel0:rw
    - /dev/capture-vi-channel1:/dev/capture-vi-channel1:rw
    - /dev/capture-vi-channel2:/dev/capture-vi-channel2:rw
    - /dev/capture-vi-channel3:/dev/capture-vi-channel3:rw
    - /dev/capture-vi-channel4:/dev/capture-vi-channel4:rw
    - /dev/capture-vi-channel5:/dev/capture-vi-channel5:rw
    - /dev/capture-vi-channel6:/dev/capture-vi-channel6:rw
    - /dev/capture-vi-channel7:/dev/capture-vi-channel7:rw
    - /dev/capture-vi-channel8:/dev/capture-vi-channel8:rw
    - /dev/capture-vi-channel9:/dev/capture-vi-channel9:rw
    - /dev/capture-vi-channel10:/dev/capture-vi-channel10:rw
    - /dev/capture-vi-channel11:/dev/capture-vi-channel11:rw
    - /dev/capture-vi-channel12:/dev/capture-vi-channel12:rw
    - /dev/capture-vi-channel13:/dev/capture-vi-channel13:rw
    - /dev/capture-vi-channel14:/dev/capture-vi-channel14:rw
    - /dev/capture-vi-channel15:/dev/capture-vi-channel15:rw
    - /dev/capture-vi-channel16:/dev/capture-vi-channel16:rw
    - /dev/capture-vi-channel17:/dev/capture-vi-channel17:rw
    - /dev/capture-vi-channel18:/dev/capture-vi-channel18:rw
    - /dev/capture-vi-channel19:/dev/capture-vi-channel19:rw
    - /dev/capture-vi-channel20:/dev/capture-vi-channel20:rw
    - /dev/capture-vi-channel21:/dev/capture-vi-channel21:rw
    - /dev/capture-vi-channel22:/dev/capture-vi-channel22:rw
