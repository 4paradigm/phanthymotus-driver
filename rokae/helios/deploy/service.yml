    - /dev/capture-vi-channel28:/dev/capture-vi-channel28:rw
    - /dev/capture-vi-channel29:/dev/capture-vi-channel29:rw
    - /dev/capture-vi-channel30:/dev/capture-vi-channel30:rw
    - /dev/capture-vi-channel31:/dev/capture-vi-channel31:rw
    - /dev/capture-vi-channel32:/dev/capture-vi-channel32:rw
    - /dev/capture-vi-channel33:/dev/capture-vi-channel33:rw
