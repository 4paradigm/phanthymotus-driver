rokae-helios:
  image: __IMAGE__
  container_name: embodied-rokae-helios
  network_mode: host
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=16m
    # Private shm under the read-only /dev bind.
    - /dev/shm:rw,nosuid,nodev,noexec,size=64m,mode=1777
  # Camera nodes are reached through a read-only /dev directory bind instead of
  # per-node `devices:` entries. Per-node entries make Docker refuse to start the
  # whole container when a node is missing; on Helios the sensor nodes appear a
  # few seconds after dockerd at boot, which left joints/battery down as well.
  # Access control is the cgroup allowlist, not the bind: only the five colour
  # V4L2 nodes (81:26 chest, 81:38 head, 81:44/46/48 SHW3H fisheyes) can be
  # opened. Tegra VI derives these minors from the device-tree channel, so they
  # are stable across reboots even when /dev/videoN numbering changes; the code
  # also requires the same numbers (camera_capture.SOURCES). Depth, IR, metadata
  # and every other V4L2 node stay denied.
  # capture-vi-channel (major 504 on this kernel, /proc/devices): the VI driver
  # opens a free /dev/capture-vi-channelN by path in the caller's mount namespace
  # when streaming starts, and the kernel picks N; without them no frames arrive.
  # No privileged mode, no extra capabilities, MKNOD stays dropped (cap_drop ALL).
  device_cgroup_rules:
    - "c 81:26 rw"
    - "c 81:38 rw"
    - "c 81:44 rw"
    - "c 81:46 rw"
    - "c 81:48 rw"
    - "c 504:* rw"
  volumes:
    - /dev:/dev:ro
    - /opt/phanthy-motus/dds-local.xml:/opt/phanthy-motus/dds-local.xml:ro
  environment:
    - ROS_DOMAIN_ID=42
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/phanthy-motus/dds-local.xml
    - ROS_LOG_DIR=/tmp/ros-log
    - PYTHONDONTWRITEBYTECODE=1
    - PYTHONUNBUFFERED=1
    - RCUTILS_COLORIZED_OUTPUT=0
    - AGENT_CORE_URL=${HELIOS_AGENT_CORE_URL:-https://127.0.0.1:15678}
    - HELIOS_STATE_URL=${HELIOS_STATE_URL:-ws://192.168.0.161:8888/ws}
    - HELIOS_BATTERY_STATE_URL=${HELIOS_BATTERY_STATE_URL:-ws://192.168.0.100/ws/AGVInfo}
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  stop_grace_period: 15s
  restart: always
