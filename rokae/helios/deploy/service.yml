rokae-helios:
  image: __IMAGE__
  container_name: embodied-rokae-helios
  network_mode: host
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=16m
  volumes:
    - /opt/phanthy-motus/dds-local.xml:/opt/phanthy-motus/dds-local.xml:ro
    # Vendor chassis SDK + its CPython 3.12 runtime, installed on the robot (not in the
    # image or Git). Same variables and defaults as the Helios spatial-map card; set them in
    # the host Compose .env if installed elsewhere.
    - ${HELIOS_SDK_PYTHON_DIR:-/home/admin/helios-dev/native-odom-runtime/sdk-python}:/opt/sdk-python:ro
    - ${HELIOS_VMR_SDK_DIR:-/home/admin/helios-dev/native-odom-runtime/vmr-sdk}:/opt/vmr-sdk:ro
  environment:
    - ROS_DOMAIN_ID=42
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/phanthy-motus/dds-local.xml
    - ROS_LOG_DIR=/tmp/ros-log
    - PYTHONDONTWRITEBYTECODE=1
    - PYTHONUNBUFFERED=1
    - RCUTILS_COLORIZED_OUTPUT=0
    - AGENT_CORE_URL=${HELIOS_AGENT_CORE_URL:-https://127.0.0.1:15678}
    - HELIOS_STATE_URL=${HELIOS_STATE_URL:-ws://192.168.0.161:8888/ws}
    - HELIOS_BATTERY_STATE_URL=${HELIOS_BATTERY_STATE_URL:-ws://192.168.0.100/ws/AGVInfo}
    - HELIOS_CHASSIS_SDK_HOST=${HELIOS_CHASSIS_SDK_HOST:-192.168.0.100}
    - HELIOS_CHASSIS_SDK_PORT=${HELIOS_CHASSIS_SDK_PORT:-9003}
    - HELIOS_CHASSIS_MOTION_ENABLED=${HELIOS_CHASSIS_MOTION_ENABLED:-0}
    - HELIOS_CHASSIS_ALLOW_LATERAL=${HELIOS_CHASSIS_ALLOW_LATERAL:-0}
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  stop_grace_period: 15s
  restart: always
