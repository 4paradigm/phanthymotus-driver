// Read-only projection of the installed chassis UI protocol.
// UiDatagram.current_state=6, RobotState.pose=1/timeStamp=3.
// Source: /static/proto/uidata.proto and /static/proto/robottype.proto.
syntax = "proto3";
package helios_pose_readonly;

message PlanarPose {
  double x = 1;
  double y = 2;
  double theta = 3;
}

message RobotState {
  PlanarPose pose = 1;
  int64 timeStamp = 3;
}

message UiDatagram {
  RobotState current_state = 6;
}
