mcp_port: 15747
name: ROKAE Helios-2.1
ros_namespace: rokae_helios
state_url: ws://192.168.0.161:8888/ws
battery_state_url: ws://192.168.0.100/ws/AGVInfo
battery_publish_hz: 1
battery_stale_timeout_s: 3.0
publish_hz: 10
stale_timeout_s: 1.0
connect_timeout_s: 3.0
reconnect_delay_s: 1.0
# Chassis movement (base_drive) via the vendor VMR AMR SDK (fetched at image build time).
chassis_motion_enabled: false  # opt in per deployment: HELIOS_CHASSIS_MOTION_ENABLED=1
chassis_sdk_dir: /opt/vmr-sdk
chassis_sdk_lib_subdir: lib
chassis_sdk_python: /opt/sdk-python/bin/python3
chassis_sdk_host: 192.168.0.100
chassis_sdk_port: 9003
chassis_command_hz: 50
chassis_max_linear_m_s: 0.2
chassis_max_angular_deg_s: 15
chassis_allow_lateral: false
