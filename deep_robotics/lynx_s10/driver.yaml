id: deep-robotics-lynx-s10-driver
name: DEEP Robotics Lynx S10 Driver
category: driver
hardware_provider: deep-robotics
hardware_model: "lynx-s10"
image_name: deep-robotics-lynx-s10
port: 15717
mcp_url: "http://localhost:15717/mcp"
description: "Lynx S10 official TLS/TCP basic_server motion, device and charging controls"
build_context_extras:
  - ../../common
cards:
  - { name: state,                 type: sensor }
  - { name: motion_info,           type: sensor }
  - { name: imu,                   type: sensor }
  - { name: joints,                type: sensor }
  - { name: battery,               type: sensor }
  - { name: native_device_status,  type: sensor }
  - { name: native_basic_status,   type: sensor }
  - { name: hard_estop,            type: sensor }
  - { name: charge_status,         type: sensor }
  - { name: errors,                type: sensor }
  - { name: navigation_status,     type: sensor }
  - { name: motion,                type: actuator }
  - { name: device,                type: actuator }
  - { name: charging,              type: actuator }
  - { name: navigation,            type: actuator }
