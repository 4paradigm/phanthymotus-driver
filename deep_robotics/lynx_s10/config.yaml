mcp_port: 15724
ros_namespace: ""
name: "云深处山猫 S10"
model_variant: "pro"
navigation_task_timeout: 180
ros:
  robot_domain_id: 0
  core_domain_id: 42
# Deployment must provide NETWORK_INTERFACE and ROBOT_NETWORK_CIDR. The latter
# must be the isolated robot-only subnet containing both this host and the S10.
topics:
  imu: "/IMU"
  joints: "/JOINTS_DATA_10HZ"
  battery: "/BATTERY_DATA"
  motion_info: "/MOTION_INFO"
  lidar: "/LIDAR/POINTS"
basic_server:
  enabled: true
  # Set this to the robot's reachable basic_server address.  It may also be
  # overridden with S10_BASIC_SERVER_HOST at deployment time.
  host: "10.21.33.103"
  tcp_port: 30003
  timeout: 2.0
