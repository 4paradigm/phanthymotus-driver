deep-robotics-lynx-s10:
  image: __IMAGE__
  container_name: embodied-deep-robotics-lynx-s10
  network_mode: host
  environment:
    - PYTHONUNBUFFERED=1
    - RCUTILS_COLORIZED_OUTPUT=0
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - ROS_LOCALHOST_ONLY=0
    - NETWORK_INTERFACE=${S10_NETWORK_INTERFACE}
    - ROBOT_NETWORK_CIDR=${S10_ROBOT_NETWORK_CIDR}
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  restart: always
  stop_grace_period: 30s
