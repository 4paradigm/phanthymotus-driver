deep-robotics-s10-pro:
  image: __IMAGE__
  container_name: embodied-deep-robotics-s10-pro
  network_mode: host
  devices:
    - /dev/snd:/dev/snd
  environment:
    - PYTHONUNBUFFERED=1
    - RCUTILS_COLORIZED_OUTPUT=0
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - ROS_LOCALHOST_ONLY=0
    - NETWORK_INTERFACE=${S10_NETWORK_INTERFACE:-auto}
    - ROBOT_NETWORK_CIDR=10.21.33.0/24
    - S10_BASIC_SERVER_HOST=${S10_BASIC_SERVER_HOST:-10.21.33.103}
    # Real motion requires explicit deployment authorization.
    - S10_MOTION_ENABLED=${S10_MOTION_ENABLED:-0}
    - S10_DRMAP_MODE=${S10_DRMAP_MODE:-auto}
    - S10_DRMAP_SSH_HOST=${S10_DRMAP_SSH_HOST:-10.21.33.106}
    - S10_DRMAP_SSH_USER=${S10_DRMAP_SSH_USER:-user}
    - S10_DRMAP_PASSWORD=${S10_DRMAP_PASSWORD:-'}
    - S10_DRMAP_DIRECTORY=${S10_DRMAP_DIRECTORY:-/var/opt/robot/data/maps}
    - S10_AUDIO_CAPTURE_DEVICE=${S10_AUDIO_CAPTURE_DEVICE:-default}
    - S10_AUDIO_PLAYBACK_DEVICE=${S10_AUDIO_PLAYBACK_DEVICE:-default}
    - AGENT_CORE_URL=https://localhost:15678
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  restart: always
  stop_grace_period: 30s
