mcp_port: 15745
ros_namespace: "s10_pro"
name: "云深处山猫 S10"
model_variant: "pro"
navigation_task_timeout: 180
ros:
  robot_domain_id: 0
  core_domain_id: null
  robot_interface: auto
  robot_network_cidr: 10.21.33.0/24
# service.yml targets the S10 onboard host: robot_server runs there and listens
# on TCP 30003. NETWORK_INTERFACE/CIDR constrain robot-domain DDS; domain 42
# publishers and the control subscriber run in loopback-profiled subprocesses.
topics:
  imu: "/IMU"
  joints: "/JOINTS_DATA_10HZ"
  battery: "/BATTERY_DATA"
  motion_info: "/MOTION_INFO"
  # Probe candidates in parallel. Direct sensor sources outrank derived clouds;
  # otherwise keep the selected source until it has gone stale.
  lidar_cloud:
    - "/local_scans"
    - "/DEPTH_POINTS"
    - "/LIDAR/POINTS"
    - "/ALIGNED_POINTS"
    - "/CLOUD_REGISTERED_BODY"
    - "/FULL_CLOUD_MAP"
    - "/HANDLER_POINTS_DEBUG"
    - "/LIO_ALIGNED_POINTS"
    - "/LOC_BODY_POINTS"
    - "/NAV_POINTS"
    - "/REGIS_ALIGNED_POINTS"
    - "/SEG_CLOUD"
    - "/cloud_depth"
    - "/cloud_local"
    - "/cloud_local_g"
    - "/cloud_nav"
    - "/cloud_now_g"
    - "/cloud_obs"
    - "/free_paths"
    - "/grid_map_3d"
    - "/height_map"
    - "/path"
  lidar_map: "/ACCUMULATED_POINTS_MAP"
camera_topics:
  camera_rear: "/camera/rear/image_raw"
  camera_left: "/camera/left/image_raw"
  camera_front: "/camera/front/image_raw"
  camera_right: "/camera/right/image_raw"
# Kept as the ROS-source fallback when camera_source is set to ros.
camera_discovery: false
camera_source: rtsp
camera_rtsp:
  camera_front: "rtsp://10.21.33.103:8554/video4"
  camera_rear: "rtsp://10.21.33.103:8554/video0"
  camera_left: "rtsp://10.21.33.103:8554/video2"
  camera_right: "rtsp://10.21.33.103:8554/video6"
# JPEG encoding and point-cloud packing run in one bounded worker process per
# stream; this keeps the robot ROS executor available for control/state topics.
media_workers: true
basic_server:
  enabled: true
  # On the onboard host, robot_server is reachable at this host address. For a
  # separate driver host, override with the S10 host's reachable address.
  host: "10.21.33.103"
  transport: tcp
  tcp_port: 30003
  tls_tcp_port: 30003
  tls_server_name: server.local
  tls_sha256_fingerprint: 6cd411bfaffed2c5d93f80d30edb514e6b194ef2e33a199a851bbff9ce50b415
  tls_client_cert: null
  tls_client_key: null
  timeout: 2.0
audio:
  mode: auto
  ssh_host: "10.21.33.103"
  ssh_user: user
  capture_device: default
  playback_device: default
controlled_spatial:
  # drmap lives on NOS, separate from AOS/basic_server. Auto uses local only
  # when this host is the NOS management host; otherwise it connects by SSH.
  mode: auto
  ssh_user: user
  ssh_host: "10.21.33.106"
  directory: /var/opt/robot/data/maps
  timeout: 30
