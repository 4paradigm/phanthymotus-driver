mcp_port: 15745
bind_host: 127.0.0.1
ros_namespace: s10_pro
name: S10 Pro
register: true
core_domain_id: 42
reader:
  domain_id: 0
  vendor_profile: /opt/phanthy-motus/s10-reader-udp.xml
topics:
  battery: /BATTERY_DATA
  joints: /JOINTS_DATA_10HZ
  imu: /IMU
  lidar: /LIDAR/POINTS
plugins:
  battery:
    enabled: true
    refresh_hz: 1.0
    stale_after_s: 5.0
  joints:
    enabled: true
    refresh_hz: 10.0
    stale_after_s: 5.0
  lidar_cloud:
    enabled: true
    refresh_hz: 10.0
    stale_after_s: 5.0
    max_points: 40000
  imu:
    enabled: true
    refresh_hz: 20.0
    stale_after_s: 5.0
