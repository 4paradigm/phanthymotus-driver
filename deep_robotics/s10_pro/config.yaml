mcp_port: 15745
ros_namespace: "s10_pro"
name: "云深处山猫 S10"
model_variant: "pro"
navigation_task_timeout: 180
ros:
  robot_domain_id: 0
  core_domain_id: null
# service.yml targets the S10 onboard host: robot_server runs there and listens
# on TCP 30003. NETWORK_INTERFACE/CIDR constrain robot-domain DDS; domain 42 is
# published only by isolated loopback-profiled subprocesses.
topics:
  imu: "/IMU"
  joints: "/JOINTS_DATA_10HZ"
  battery: "/BATTERY_DATA"
  motion_info: "/MOTION_INFO"
  # Probe candidates in parallel. Direct sensor sources outrank derived clouds;
  # otherwise keep the selected source until it has gone stale.
  lidar_cloud:
    - "/local_scans"
    - "/DEPTH_POINTS"
    - "/LIDAR/POINTS"
    - "/ALIGNED_POINTS"
    - "/CLOUD_REGISTERED_BODY"
    - "/FULL_CLOUD_MAP"
    - "/HANDLER_POINTS_DEBUG"
    - "/LIO_ALIGNED_POINTS"
    - "/LOC_BODY_POINTS"
    - "/NAV_POINTS"
    - "/REGIS_ALIGNED_POINTS"
    - "/SEG_CLOUD"
    - "/cloud_depth"
    - "/cloud_local"
    - "/cloud_local_g"
    - "/cloud_nav"
    - "/cloud_now_g"
    - "/cloud_obs"
    - "/free_paths"
    - "/grid_map_3d"
    - "/height_map"
    - "/path"
  lidar_map: "/ACCUMULATED_POINTS_MAP"
camera_rtsp:
  camera_rear: "/video0"
  camera_left: "/video2"
  camera_front: "/video4"
  camera_right: "/video6"
  format: "video/h265"
# Point-cloud packing runs in bounded workers so it cannot block state callbacks.
media_workers: true
basic_server:
  enabled: true
  # On the onboard host, robot_server is reachable at this host address. For a
  # separate driver host, override with the S10 host's reachable address.
  host: "10.21.33.103"
  tcp_port: 30003
  timeout: 2.0
