id: deep-robotics-s10-pro-driver
name: DEEP Robotics S10 Pro Driver
category: driver
hardware_provider: deep-robotics
hardware_model: s10-pro
image_name: deep-robotics-s10-pro
port: 15745
mcp_url: http://localhost:15745/mcp
description: S10 Pro TCP locomotion, continuous velocity servo, route navigation, drmap map management, measured odometry, lighting, charging, IMU, battery, joints, cameras and LiDAR streams
build_context_extras:
  - ../../common
cards:
  - { name: model,       type: resource }
  - { name: imu,         type: sensor }
  - { name: joints,      type: sensor }
  - { name: joint_state, type: sensor }
  - { name: loco_state,  type: sensor }
  - { name: battery,     type: sensor }
  - { name: lidar_cloud, type: sensor }
  - { name: lidar_map,   type: sensor }
  - { name: camera_rear,  type: sensor }
  - { name: camera_left,  type: sensor }
  - { name: camera_front, type: sensor }
  - { name: camera_right, type: sensor }
  - { name: loco,        type: actuator }
  - { name: loco_servo,  type: actuator }
  - { name: head_light,  type: actuator }
  - { name: tail_light,  type: actuator }
  - { name: charging,    type: actuator }
  - { name: navigation,  type: actuator }
  - { name: controlled_spatial, type: actuator }
