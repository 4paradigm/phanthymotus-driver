mcp_port: 15747
name: "Leju Kuavo 5-W Driver"
ros_namespace: ""
# Optional operator-provided serial; not a robot_version or URDF selector.
robot_serial: null
# Set false to disable motion, resume and mode changes while preserving reads/stop.
motion_enabled: true
# Image-owned source is provisioned over SSH; no manually installed helper needed.
host_runtime:
  enabled: true
  # Always wait for the boot owner to confirm initialization/BaseArm/pause.
  controller_boot_required: true
provisioning:
  enabled: true
  master: http://192.168.26.1:11311
  # Fixed allowlist only, when existing vendor ROS/PulseAudio lacks a dependency.
  install_missing_packages: true
  auto_initialize_and_pause: true
  # Addresses/users/ROS IPs/passwords default to connection_defaults.py.
  # No card-level connection configuration; edit that module and rebuild.
  # Advanced private overrides: environment or ssh-secrets.json (0600).
  # Set use_default_credentials: false per role to require explicit keys/secrets.
  # Upper host is local to the host-network container.
  chassis: {volume: 30}
# Start rosbridge_server on the ROS Noetic host and point this URL at it.
rosbridge_url: "ws://127.0.0.1:9090"
sensors:
  imu_topic: /imu
  auto_start: [joints, imu, loco_state, battery, laser_scan, camera_left, camera_right, camera_head, camera_depth]
  # Only admit body-frame odometry; extend after verifying the robot's TF tree.
  odom_body_frames: [base_link, base_footprint]
  # SDK permits N*m or current. Set N*m only after verifying robot hardware output.
  # Until then normalized tau is null; vendor.joint_torque preserves the raw values.
  joint_torque_unit: null
  # No hardware-verified limits have been supplied. Arm/leg move_joints and
  # named arm/leg/waist joint actions require a matching commissioning record.
  # Never copy the display URDF limits as verified control limits. See README.
  joint_limits: null
plugins:
  loco: {enabled: true}
  arm: {enabled: true}
  leg: {enabled: true}
  waist: {enabled: true}
  head: {enabled: true}
  speaker: {enabled: true}
  joints: {enabled: true}
  imu: {enabled: true}
  loco_state: {enabled: true}
  model: {enabled: true}
  battery: {enabled: true}
  laser_scan: {enabled: true}
  camera_left: {enabled: true}
  camera_right: {enabled: true}
  camera_head: {enabled: true}
  camera_depth: {enabled: true}
