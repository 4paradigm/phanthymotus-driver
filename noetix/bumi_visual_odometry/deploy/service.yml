noetix-bumi-visual-odometry:
  image: __IMAGE__
  container_name: embodied-noetix-bumi-visual-odometry
  network_mode: host
  ipc: host
  # No USB mount, privileged mode, Docker socket or dependency on the camera
  # lifecycle: the sidecar only subscribes to the bundle's shared raw stream,
  # and stopping it must never stop media production.
  volumes:
    - /opt/phanthy-motus/dds-local.xml:/opt/phanthy-motus/dds-local.xml:ro
    - /opt/phanthy-motus/data/bumi_visual_odometry:/opt/phanthy-motus/data/bumi_visual_odometry
  environment:
    - ROS_DOMAIN_ID=42
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/phanthy-motus/dds-local.xml
  cpus: 2.0
  mem_limit: 3g
  pids_limit: 128
  restart: always
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
