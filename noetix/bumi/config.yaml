mcp_port: 15704
ros_namespace: ""   # 留空则自动使用 hostname

plugins:
  state:
    enabled: true
  loco:
    enabled: true
  mic:
    enabled: true
  speaker:
    enabled: true
  camera:
    enabled: true
  squat_counter:
    enabled: true
    window_s: 1.5
    down_ratio: 0.3
    lost_s: 3.0
    min_confidence: 0.4
  bicep_curl_counter:
    enabled: true
    lift_px: 40.0
    hold_s: 0.15
    lost_s: 2.0
    min_confidence: 0.3
  motion_state:
    enabled: true
    # 2 Hz: sufficient for Agent-facing motion telemetry without excessive DDS reads.
    poll_interval_s: 0.5
    # Activity classification only; this is not a motor safety or command limit.
    activity_velocity_threshold: 0.15
  vision_capture:
    enabled: true
    # Existing host bind mount keeps photos/videos across container replacements.
    output_dir: /opt/phanthy-motus/data/vision_capture
    fps: 15
    max_duration_s: 30
