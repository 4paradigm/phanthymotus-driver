mcp_port: 15704
ros_namespace: ""   # 留空则自动使用 hostname

plugins:
  state:
    enabled: true
  loco:
    enabled: true
  mic:
    enabled: true
  speaker:
    enabled: true
  camera:
    enabled: true
    # Bumi supports either official App video transfer or Phanthy's direct
    # camera/depth Cards. To use these Cards, the Bumi deployment enters the
    # host mount namespace and runs:
    #   systemctl disable --now noetix-video-capture.service
    # Set false only when official App video transfer must retain the camera.
    disable_vendor_capture_service: true
  motion_state:
    enabled: true
    # 2 Hz: sufficient for Agent-facing motion telemetry without excessive DDS reads.
    poll_interval_s: 0.5
    # Activity classification only; this is not a motor safety or command limit.
    activity_velocity_threshold: 0.15
  vision_capture:
    enabled: true
    # Existing host bind mount keeps photos/videos across container replacements.
    output_dir: /opt/phanthy-motus/data/vision_capture
    fps: 15
    max_duration_s: 30
  face_whitelist:
    enabled: true
    # Each direct child directory is one person. Keep biometric data on the
    # robot host; never copy enrollment photos into the image or Git.
    whitelist_dir: /opt/phanthy-motus/data/face_whitelist
    # LBPH uses a distance: lower is more similar. Start strict and validate
    # the threshold on the actual camera before using the result in a workflow.
    distance_threshold: 60
    min_face_size: 80
    max_images_per_person: 20
  auto_guard:
    enabled: true
    # The canvas must connect camera -> auto_guard -> tts -> speaker and
    # start the project. Driver boot alone never arms this speech-only card.
    sample_interval_s: 0.5
    confirm_frames: 3
    rearm_no_face_frames: 3
    cooldown_s: 30
    max_frame_age_s: 2
    # Must equal the dedicated Perception TTS card ID installed on the canvas.
    tts_instance_id: bumi-guard-tts
