mcp_port: 15704
ros_namespace: ""   # 留空则自动使用 hostname

plugins:
  state:
    enabled: true
  loco:
    enabled: true
  mic:
    enabled: true
  speaker:
    enabled: true
  camera:
    enabled: true
  motion_state:
    enabled: true
    # 2 Hz: sufficient for Agent-facing motion telemetry without excessive DDS reads.
    poll_interval_s: 0.5
    # Activity classification only; this is not a motor safety or command limit.
    activity_velocity_threshold: 0.15
  state_record:
    enabled: true
    # This directory is on the persistent host volume declared in deploy/service.yml.
    storage_dir: /opt/phanthy-motus/data/bumi/state-records
    # Samples older than this are still recorded but marked fresh=false.
    max_age_s: 3.0
    # Wait for the first color JPEG produced after record_once is clicked.
    camera_timeout_s: 1.0
    # Defaults shown by the state_record card.
    default_label: status
    default_interval_s: 1.0
    # Allowed timed-recording interval range, in seconds.
    min_interval_s: 0.1
    max_interval_s: 3600.0
