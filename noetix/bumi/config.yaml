mcp_port: 15704
ros_namespace: ""   # 留空则自动使用 hostname

plugins:
  state:
    enabled: true
  loco:
    enabled: true
  mic:
    enabled: true
    # 采样增益：默认 50（SDK 信号约 8-bit 动态，放大到 16-bit 可用电平）。
    # 回环测试/近距离用低增益（5~15）抑制声学正反馈啸叫；正常语音识别用 50。
    gain: 50
  speaker:
    enabled: true
    # 输入音频 topic 列表：默认同时订阅 /{namespace}/mic/audio（mic 直连）和
    # /remote_control/audio（remote_audio 上传），画布两条线都能接，收到即播。
    # 如需自定义，可在此显式覆写：
    # input_topics: ["/bumi/mic/audio", "/remote_control/audio"]
    # 单 topic 也兼容旧写法 input_topic: "/remote_control/audio"
  camera:
    enabled: true
  motion_state:
    enabled: true
    # 2 Hz: sufficient for Agent-facing motion telemetry without excessive DDS reads.
    poll_interval_s: 0.5
    # Activity classification only; this is not a motor safety or command limit.
    activity_velocity_threshold: 0.15
  robot_status:
    enabled: true
