mcp_port: 15704
ros_namespace: ""   # 留空则自动使用 hostname

plugins:
  state:
    enabled: true
  loco:
    enabled: true
  mic:
    enabled: true
  speaker:
    enabled: true
  camera:
    enabled: true
  motion_state:
    enabled: true
    # 2 Hz: sufficient for Agent-facing telemetry/events without excessive DDS reads.
    poll_interval_s: 0.5
    history_size: 100
    # Activity classification only; this is not a motor safety or command limit.
    activity_velocity_threshold: 0.15
  media_system:
    enabled: true
