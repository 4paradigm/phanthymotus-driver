mcp_port: 15704
ros_namespace: ""   # 留空则自动使用 hostname

plugins:
  state:
    enabled: true
  loco:
    enabled: true
  # 底盘的流式控制卡片（motus.control/1 的 twist）。和上面的 loco 是同一个身体的
  # 两条路径：loco 是调用形态，一次 tools/call 一个动作；这张是数据面，订阅一路
  # control/velocity 指令流，给 actucore 的 navi 这类策略用。两者显式仲裁 ——
  # loco / stand_up_lie_prone / semantic_action / action_recording 里任何一个动作
  # 都会先把这张卡片暂停，人和 LLM 的显式指令优先于正在跑的策略。
  loco_servo:
    enabled: true
    # **默认只打日志，不驱动底盘。** 速度参数已经完成真机标定；首次接入完整
    # navi 流水线时仍先核对它想发什么。确认视觉控制方向后可在卡片上关闭
    # dry_run（configSchema 立即生效，不用重新部署）。
    dry_run: true
    expected_hz: 10
    # 要求 workmode=2（walking）。只有在没接腿的台架上才需要关。
    require_standing: true

    # ── 速度标定 ─────────────────────────────────────────────────────────
    # Bumi 的 publish_cmd 收的是归一化的 [-1, 1]（厂商示例直接塞手柄 axes），
    # 而协议要求 m/s / rad/s，所以这几个数是两者之间的换算。
    # 七个参数已于 2026-10-09 在真机完成测量，步骤和原始结果见 README。
    calibration_source: measured
    full_scale_vx_mps: 0.55     # x=1.0，前进 165 cm / 3 s（两次一致）
    full_scale_vy_mps: 0.20     # |y|=1.0，可靠三次均值约 59.5 cm / 3 s
    full_scale_wz_rads: 0.83    # |z|=1.0，取较慢方向的 190.5 deg / 4 s
    # 死区：低于这个值腿式机器人根本不动（要凑齐一个步态周期）。
    # 零不是"没有门槛"，而是"这台机器人能任意慢地挪"，那是个错误的声明。
    min_vx_mps: 0.25            # 归一化边界 0.45 × 0.55
    min_vy_mps: 0.12            # 归一化边界 0.60 × 0.20
    min_wz_rads: 0.33           # 归一化边界 0.40 × 0.83
    # 已经在走的时候的偏航死区。
    min_wz_moving_rads: 0.25    # 归一化边界 0.30 × 0.83
  mic:
    enabled: true
  sound_direction:
    enabled: true
  speaker:
    enabled: true
  camera:
    enabled: true
    # Bumi supports either official App video transfer or Phanthy's direct
    # camera/depth Cards. To use these Cards, the Bumi deployment enters the
    # host mount namespace and runs:
    #   systemctl disable --now noetix-video-capture.service
    # Set false only when official App video transfer must retain the camera.
    disable_vendor_capture_service: true
  # 只读 RGB-D 视觉里程计（RTAB-Map rgbd_odometry，在 bundle 进程内运行）。
  # 内置 IMU 只辅助旋转初值；无惯性位移积分/EKF，不参与运动控制；
  # 停止本卡片只回收它自己的估计子进程和私有话题，不影响相机/媒体/动作卡。
  # 默认按水平前装约定输出机体轴：x 前、y 左、z 上（vendor.pose_reference=body_axes；
  # 只有实测 camera_to_body 才报 body）。
  visual_odometry:
    # 默认开启只读视觉里程计；原始 RGB-D 分支限频见下方。
    enabled: true
    # Rotation prior from the robot body IMU. controller polls HighController
    # directly (shipped default); state falls back to the StatePlugin topic.
    # The camera keeps its normal video-only path; no camera IMU or custom
    # RSUSB SDK is required. Set imu_assisted: false for visual-only mode.
    imu_assisted: true
    imu_source: controller
    # Raw branch sample rate when enabled. The measured raw cadence is ~8.3 Hz
    # at this cap and RTAB-Map currently processes ~7.5-9 Hz, so 10 Hz bounds
    # the extra DDS/CPU load instead of duplicating every 30 Hz camera frame.
    # Invalid values fall back to 10 Hz; the camera-side upper bound is 30 Hz.
    max_rate_hz: 10
    # Permanent body-axis convention for the standard level, forward-facing
    # camera: robot x forward, y left, z up. The quaternion is still an axis
    # assumption (not a measured mount), hence assumed: true. The translation
    # IS measured (2026-11-24) and is the camera optical centre relative to the
    # head geometric centre, which is the origin of `head_center_link` in the
    # URDF: +5 cm forward (x), +3.5 cm left (y), +0.5 cm up (z).
    calibration:
      calibration_id: assumed-level-forward-optical-to-body
      fixed_mount: true
      assumed: true
      camera_to_body:
        translation: [0.05, 0.035, 0.005]
        quaternion: [-0.5, 0.5, -0.5, 0.5]
    # 内置 tf 树（不作为独立卡暴露）：把 URDF 静态链、关节动态边与相机自身的
    # odom 位姿发到 /tf、/tf_static，供下游用 tf2 自行 lookup。默认关闭：
    # 开启视觉里程计卡不会自动发 tf，须显式打开此开关。视觉 JSON 输出不受影响。
    tf:
      enabled: false
      urdf_path: /work/resource/bumi_model.urdf
      publish_rate_hz: 10        # status 话题频率；/tf 由关节样本与视觉位姿驱动
      max_joint_age_s: 0.5       # 超过此时长判定 joints_stale，不再当作新位姿
  # 目标注视转身（actuator）：只发 publish_cmd(0,0,z)，不平移。默认关闭：
  # start 只订阅、不会动；还必须显式 enable(confirm=true) 才获得短时授权。
  visual_facing:
    enabled: false
    target_id: ""               # 空 = 输入里必须只有一个有效目标；多目标请填 marker_id
    units: m                    # m / mm；不按数值大小猜单位
    yaw_sign: 1                 # +z = 左转；首次真机用 ±30° ArUco 核对，必要时改 -1
    center_tolerance_deg: 5.0   # 进入这个角度即停（画面中心容差）
    exit_tolerance_deg: 12.0    # 停着时超过这个角度才重新转（滞回，必须大于上行）
    settle_ticks: 2             # 连续 N 帧在容差内才确认居中，防单帧抖动
    target_ttl_ms: 500          # 观测时间戳超过此年龄即视为目标丢失
    max_future_ms: 500          # 未来时间戳超过此值拒收
    control_hz: 20.0            # 控制/状态循环频率；SDK 指令间隔由卡内保证 ≥2 ms
    kp: 1.2                     # 归一化 z = clamp(kp × 误差弧度, min_z, max_z)
    min_z: 0.45                 # 高于 ~0.40 的腿式静区，低速用占空比而不是缩小 z
    max_z: 0.70
    fine_duty: 0.4              # 滞回细调区的速度占空比
    auth_window_s: 8.0          # 短时授权窗口；enable 可续期，过期立即停
    max_turn_s: 12.0            # 单次连续转身上限，超时需重新 enable
    # estop 来自软件急停锁存卡的 /{ns}/state/estop（data/json 的 latched 字段）。
    # 默认只听不强制：没有该卡时状态报 unknown；要求必须看到 estop 才允许转向
    # 时把 require_estop 设为 true（未接入或数据过期都会阻止运动）。
    estop_topic: ""
    require_estop: false
    estop_ttl_ms: 1000
  motion_state:
    enabled: true
    # 2 Hz: sufficient for Agent-facing motion telemetry without excessive DDS reads.
    poll_interval_s: 0.5
    # Activity classification only; this is not a motor safety or command limit.
    activity_velocity_threshold: 0.15
  vision_capture:
    enabled: true
    # Existing host bind mount keeps photos/videos across container replacements.
    output_dir: /opt/phanthy-motus/data/vision_capture
    fps: 15
    max_duration_s: 30
