samsung-watch7:
  image: __IMAGE__
  container_name: embodied-samsung-watch7
  network_mode: host
  volumes:
    - /opt/phanthy-motus/dds-local.xml:/opt/phanthy-motus/dds-local.xml:ro
  environment:
    - ROS_DOMAIN_ID=42
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/phanthy-motus/dds-local.xml
    - PYTHONUNBUFFERED=1
    - WATCH7_DEVICE_TOKEN
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  restart: always
