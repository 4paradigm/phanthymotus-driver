mcp_port: 15702
ros_namespace: ""  # auto-detect from hostname

# Robot variant: "lite" (23 DOF), "sp" (29 DOF), "pro" (31 DOF)
variant: "sp"

# gRPC endpoint for locomotion control
grpc_host: "localhost"
grpc_port: 6666

# DDS domain ID (Adam SDK default is 1)
dds_domain_id: 1

plugins:
  state:
    enabled: true
    publish_rate_hz: 50
  loco:
    enabled: true
  arm:
    enabled: true
    publish_rate_hz: 100
  hand:
    enabled: true
    hand_type: "pnd"  # "pnd" (0-1000) or "inspire" (0-1800)
  model:
    enabled: true
