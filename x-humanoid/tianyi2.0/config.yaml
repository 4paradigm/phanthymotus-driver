mcp_port: 15707
ros_namespace: ""   # 留空则自动使用 hostname
name: "Tianyi 2.0 Pro"

slamtec:
  base_url: "http://192.168.11.1:1448"

plugins:
  state:
    enabled: true
  camera:
    enabled: true
  imu:
    enabled: true
  camera_depth:
    enabled: true
    # Raw 640x480 Z16 is 614 KiB/frame. Keep the dashboard stream below the
    # browser/DDS forwarding budget and always display the newest frame.
    hz: 8
  camera_pointcloud:
    enabled: true
    # Head camera height above the floor. The point-cloud renderer uses Y=0
    # as its grid plane, so raise the gravity-levelled cloud by this amount.
    floor_offset_m: 1.50
  asr:
    enabled: true
  nav_state:
    enabled: true
  power_board:
    enabled: true
  motors:
    enabled: true
  hand_state:
    enabled: true
  remote_event:
    enabled: true
  head:
    enabled: true
  head_gesture:
    enabled: true
  arm:
    enabled: true
  arm_gesture:
    enabled: true
  waist:
    enabled: true
  hand:
    enabled: true
  tts:
    enabled: true
  voice_play:
    enabled: true
  nav:
    enabled: true
  chat:
    enabled: true
  voice_chat:
    enabled: true
  controlled_spatial:
    enabled: true
    native_slam_pcd_dir: "/opt/phanthy-motus/data/maps"
    native_slam_db_path: "/opt/phanthy-motus/data/controlled_spatial.db"
  robot_faults:
    enabled: true
  laser_scan:
    enabled: true
  chassis_raw:
    enabled: true
  ext_mic:
    enabled: true
    network_sources:
      - name: "DJI Wireless Mic"
        url: "tcp://192.168.41.1:9800"
  light:
    enabled: true
