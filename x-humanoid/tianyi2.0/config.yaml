mcp_port: 15707
ros_namespace: ""   # 留空则自动使用 hostname
name: "Tianyi 2.0 Pro"

slamtec:
  base_url: "http://192.168.11.1:1448"

plugins:
  # Host-side system cards share one plugin instead of one Python module each.
  # Requires the documented --pid host + --privileged deployment settings.
  system:
    enabled: true
    host_root: "/proc/1/root"
    bag_dir: "/home/ubuntu/bags"
    setup: "/home/ubuntu/ros2ws/install/setup.bash"
  state:
    enabled: true
  camera:
    enabled: true
  asr:
    enabled: true
  nav_state:
    enabled: true
  head:
    enabled: true
  head_gesture:
    enabled: true
  arm:
    enabled: true
  waist:
    enabled: true
  hand:
    enabled: true
  tts:
    enabled: true
  nav:
    enabled: true
  chat:
    enabled: true
