mcp_port: 15707
ros_namespace: ""   # 留空则自动使用 hostname
name: "X-humanoid Tianyi 2.0 Pro Bundle"

# Forward all topics from domain 0 (body controller) to domain 42 (agent-core)
# via socket bridge. This enables proper DDS isolation.
domain_bridge:
  enabled: true

# DEPRECATED: Use domain_bridge instead. Left for backward compatibility.
# Run the skeleton publisher in its own ROS process. The main bundle keeps
# the other cards but does not publish a competing joints topic.
joints_bridge:
  enabled: false

# Make power-on self-check automatic on the robot's x86 motion-control board.
auto_self_check:
  enabled: true
  ssh_host: "192.168.41.1"
  ssh_user: "ubuntu"
  ssh_password: "123"
  timeout: 15

slamtec:
  base_url: "http://192.168.11.1:1448"

plugins:
  state:
    enabled: true
  camera:
    enabled: true
  camera_snapshot:
    enabled: true
    output_dir: "/opt/phanthy-motus/data/images"
    # The channel-visible path is derived from the persistent mount. Set
    # PHANTHY_CHANNEL_OUTPUT_DIR only when deployment uses another mount.
    jpeg_quality: 90
    video_fps: 20
    default_video_seconds: 5
    max_video_seconds: 60
  imu:
    enabled: true
  camera_depth:
    enabled: true
    # Compressed hardware depth, latest frame only; directly connects to navi.
    hz: 15
  camera_pointcloud:
    enabled: true
    # Head camera height above the floor. The point-cloud renderer uses Y=0
    # as its grid plane, so raise the gravity-levelled cloud by this amount.
    floor_offset_m: 1.50
  asr:
    enabled: true
  nav_state:
    enabled: true
  loco_state:
    enabled: true
    hz: 10  # Target rate; actual refresh depends on chassis HTTP latency.
    request_timeout: 0.5
  loco_servo:
    enabled: true  # Present but inert until canvas/MCP start.
    expected_hz: 10
    max_vx: 0.3  # Operational speed cap, not a vendor hardware maximum.
    max_wz: 1.0  # rad/s; accepts navi search turns up to +/-1.0.
    linear_acceleration: 0.3  # m/s^2; explicit zero stops immediately.
    angular_acceleration: 0.6  # rad/s^2
    dry_run: true  # First deployment must inspect commands before enabling real motion.
    # Official Slamware SDK TCP endpoint, distinct from HTTP :1448.
    sdk_host: "192.168.11.1"
    sdk_port: 1445
    sdk_connect_timeout_ms: 1500
    sdk_reply_timeout: 0.25
    rotate_only: false
    # No verified native standing FSM is available for this wheeled platform.
    # To require standing, configure a trusted domain-0 std_msgs/Bool source.
    require_standing: false
    standing_topic: ""
    standing_timeout: 1.0
  power_board:
    enabled: true
  motors:
    enabled: true
  hand_state:
    enabled: true
  remote_event:
    enabled: true
  head:
    enabled: true
  head_gesture:
    enabled: true
  arm:
    enabled: true
  arm_gesture:
    enabled: true
  waist:
    enabled: true
  hand:
    enabled: true
  servo:
    # 执行模型（VLA 等）的连续控制入口：26 维 = 14 臂(rad) + 12 指(0 张开..1 握紧)。
    #
    # 和 arm / hand 一样默认打开 —— 这里的 enabled 只决定这张卡片**出不出现**
    # 在工具列表和侧边栏里，不决定它动不动。真正的门槛有三道，都在别处：
    #   1. 画布上必须有一路 control/joint 连到它，否则 start 会因为拿不到
    #      input_topic 而拒绝；
    #   2. start 必须显式带 confirm_motion: true；
    #   3. 每一条指令还要过驱动侧 ControlSink 的检查链。
    # 容器重启也不会让它自己跑起来（bundle 的 start() 是空的）。
    # 实际上它比 arm 更难被误触发：arm 一次 tools/call 就动。
    enabled: true
    expected_hz: 30
    # 每条指令下发给关节的角速度，厂商允许区间 [0.2, 1.5] rad/s。
    arm_speed: 0.5
    # 指令断流时是否张开双手。默认否：松手会把正在搬的东西摔到下面的东西上，
    # 而"继续攥着"和"松开"哪个更糟取决于机器人在干什么。见 servo.py 的 _hold。
    release_hands_on_watchdog: false
  tts:
    enabled: true
  voice_play:
    enabled: true
  nav:
    enabled: true
  home:
    enabled: true
  voice_chat:
    enabled: true
  controlled_spatial:
    enabled: true
    native_slam_pcd_dir: "/opt/phanthy-motus/data/maps"
    native_slam_db_path: "/opt/phanthy-motus/data/controlled_spatial.db"
    password: "123456"
  controlled_spatial_map:
    enabled: true
    native_slam_db_path: "/opt/phanthy-motus/data/controlled_spatial.db"
    cache_dir: "/opt/phanthy-motus/data/map-visuals"
    poll_hz: 3.0
    artifact_hz: 0.4
    head_pointcloud_enabled: true
    head_pointcloud_topic: "/ob_camera_head/depth/points"
    head_recording_enabled: false
  robot_faults:
    enabled: true
  laser_scan:
    enabled: true
  chassis_raw:
    enabled: true
  ext_mic:
    enabled: true
    network_sources:
      - ssh_host: "192.168.41.1"
        ssh_user: "ubuntu"
        ssh_password: "123"
        port: 9800
        sender_path: "/home/ubuntu/audio_sender.py"
  light:
    enabled: true
