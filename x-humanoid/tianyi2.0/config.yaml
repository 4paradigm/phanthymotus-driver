  camera:
    enabled: true
  asr:
    enabled: true
  nav_state:
    enabled: true
  head:
    enabled: true
  head_gesture:
    enabled: true
  arm:
    enabled: true
  arm_gesture:
    enabled: true
  waist:
    enabled: true
  hand:
    enabled: true
  tts:
    enabled: true
  nav:
    enabled: true
  chat:
    enabled: true
