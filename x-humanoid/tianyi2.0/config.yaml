mcp_port: 15707
ros_namespace: ""   # 留空则自动使用 hostname
name: "X-humanoid Tianyi 2.0 Pro Bundle"

# Forward all topics from domain 0 (body controller) to domain 42 (agent-core)
# via socket bridge. This enables proper DDS isolation.
domain_bridge:
  enabled: true

# DEPRECATED: Use domain_bridge instead. Left for backward compatibility.
# Run the skeleton publisher in its own ROS process. The main bundle keeps
# the other cards but does not publish a competing joints topic.
joints_bridge:
  enabled: false

# Make power-on self-check automatic on the robot's x86 motion-control board.
auto_self_check:
  enabled: true
  ssh_host: "192.168.41.1"
  ssh_user: "ubuntu"
  ssh_password: "123"
  timeout: 15

slamtec:
  base_url: "http://192.168.11.1:1448"

plugins:
  state:
    enabled: true
  camera:
    enabled: true
  camera_snapshot:
    enabled: true
    output_dir: "/opt/phanthy-motus/data/images"
    # The channel-visible path is derived from the persistent mount. Set
    # PHANTHY_CHANNEL_OUTPUT_DIR only when deployment uses another mount.
    jpeg_quality: 90
    video_fps: 20
    default_video_seconds: 5
    max_video_seconds: 60
  imu:
    enabled: true
  camera_depth:
    enabled: true
    # Compressed hardware depth, latest frame only; directly connects to navi.
    hz: 15
  camera_pointcloud:
    enabled: true
    # Head camera height above the floor. The point-cloud renderer uses Y=0
    # as its grid plane, so raise the gravity-levelled cloud by this amount.
    floor_offset_m: 1.50
  # Devices and left/right bindings are selected per canvas instance.
  wrist_camera:
    enabled: true
    jpeg_quality: 85
    state_file: /opt/phanthy-motus/data/wrist-camera.json
  asr:
    enabled: true
  nav_state:
    enabled: true
  loco_state:
    enabled: true
    # Fast control feedback reuses one HTTP connection. Human-facing telemetry
    # is sampled independently so IMU/mileage latency cannot stall odometry.
    hz: 20
    imu_hz: 5
    length_hz: 1
    request_timeout: 0.2
  loco_servo:
    enabled: true  # Present but inert until canvas/MCP start.
    expected_hz: 10
    max_vx: 0.5  # Configured fast-preset ceiling; verify it in an open test area.
    speed_preset: "normal"  # slow=0.15, normal=0.30, fast=0.50 m/s; restart navi after changing.
    max_wz: 1.0  # rad/s; accepts navi search turns up to +/-1.0.
    linear_acceleration: 0.3  # m/s^2; explicit zero stops immediately.
    angular_acceleration: 2.0  # rad/s^2; bounded steering response, configurable via MCP.
    wz_limit: 1.0  # rad/s; turn commands above this are clamped (not rejected). <= max_wz.
    # Optional driver-owned response metadata for a planner is supported; keep
    # it absent until gain/delay/settling have a traceable measurement or spec.
    dry_run: true  # First deployment must inspect commands before enabling real motion.
    # Official Slamware SDK TCP endpoint, distinct from HTTP :1448.
    sdk_host: "192.168.11.1"
    sdk_port: 1445
    sdk_connect_timeout_ms: 1500
    sdk_reply_timeout: 0.25
    rotate_only: false
    # No verified native standing FSM is available for this wheeled platform.
    # To require standing, configure a trusted domain-0 std_msgs/Bool source.
    require_standing: false
    standing_topic: ""
    standing_timeout: 1.0
  power_board:
    enabled: true
  motors:
    enabled: true
  hand_state:
    enabled: true
  remote_event:
    enabled: true
  head:
    enabled: true
  head_gesture:
    enabled: true
  arm:
    enabled: true
  arm_gesture:
    enabled: true
  waist:
    enabled: true
  hand:
    enabled: true
  servo:
    # 执行模型（VLA 等）的连续控制入口：26 维 = 14 臂(rad) + 12 指(0 张开..1 握紧)。
    #
    # 和 arm / hand 一样默认打开 —— 这里的 enabled 只决定这张卡片**出不出现**
    # 在工具列表和侧边栏里，不决定它动不动。真正的门槛有三道，都在别处：
    #   1. 画布上必须有一路 control/joint 连到它，否则 start 会因为拿不到
    #      input_topic 而拒绝；
    #   2. start 必须显式带 confirm_motion: true；
    #   3. 每一条指令还要过驱动侧 ControlSink 的检查链。
    # 容器重启也不会让它自己跑起来（bundle 的 start() 是空的）。
    # 实际上它比 arm 更难被误触发：arm 一次 tools/call 就动。
    enabled: true
    expected_hz: 30
    # 每条指令下发给关节的角速度，厂商允许区间 [0.2, 1.5] rad/s。
    arm_speed: 0.5
    # 指令断流时是否张开双手。默认否：松手会把正在搬的东西摔到下面的东西上，
    # 而"继续攥着"和"松开"哪个更糟取决于机器人在干什么。见 servo.py 的 _hold。
    release_hands_on_watchdog: false
  tts:
    enabled: true
  voice_play:
    enabled: true
  nav:
    enabled: true
  home:
    enabled: true
  voice_chat:
    enabled: true
  controlled_spatial:
    enabled: true
    native_slam_pcd_dir: "/opt/phanthy-motus/data/maps"
    native_slam_db_path: "/opt/phanthy-motus/data/controlled_spatial.db"
    password: "123456"
  controlled_spatial_map:
    enabled: true
    native_slam_db_path: "/opt/phanthy-motus/data/controlled_spatial.db"
    cache_dir: "/opt/phanthy-motus/data/map-visuals"
    poll_hz: 3.0
    artifact_hz: 0.4
    head_pointcloud_enabled: true
    head_pointcloud_topic: "/ob_camera_head/depth/points"
    head_recording_enabled: false
  robot_faults:
    enabled: true
  weigh:
    # 手掌托举称重（实验性）。卡片只有 weigh / reset：weigh 自动抬臂、去皮、等人放物品、测量；
    # reset 张开手指、放下手臂。经 arm、hand 卡执行（需这两张卡启用）。卡片自己不出声：
    # 要让用户知道的话（to_user）发到 weigh_state，由 decision_core 决定怎么转告。
    # 默认开启：不调用时只订阅、不动；只有显式调用 weigh / reset 才会移动手臂和手指。
    enabled: true
    sides: [left, right]    # 卡片上可选的手（默认 right；两只手都启用时还可选 both）
    state_file: /opt/phanthy-motus/data/tianyi-weigh.json   # 比例系数持久化
    load_limit_kg: null     # 不设固定重量上限，由 current_ratio_max 判定
    current_ratio_max: 0.6  # 所称那只手臂任一关节电流超过额定 60% → valid=false（掌心约 2 kg，未实测）
    joint_dev_deg: 1.5      # 关节相对去皮时偏差超过 1.5° → valid=false
    default_hand: cup       # 托举手型：四指立起 65 围住掌心
    place_window_s: 30      # 发出"可以放了"之后等人放物品的时间（转告可能晚几秒，给宽一些）
    place_window_both_s: 30 # side=both 时两只手都要放，等待时间
    detect_kg: 0.05         # 掌上读数超过此值算放上了物品
    reset_confirm_window_s: 60  # reset 请用户确认掌心是空的之后，这么多秒内再 reset 一次才动
    # 轻物体偏高的修正：[[原始读数 kg, 修正系数], ...]，mass = raw / (scale × f)，表内线性插值，
    # 最后一个点之后 f=1。2026-11-25 电子秤实测（102–813 g），400 g 以上直接用比例系数。
    low_load_correction:
      right: [[0.1213, 1.115], [0.2296, 1.0845], [0.5397, 1.0]]
      left: [[0.1308, 1.1695], [0.2291, 1.0758], [0.3381, 1.0242], [0.4310, 1.0]]
  weigh_state:
    # weigh 卡每有一句要让用户知道的话（to_user），就往 /{ns}/state/weigh（data/json）发一条，
    # 带上最近一次结果；平时不发。连到 decision_core 时每条都会唤醒它一次。
    enabled: true
  laser_scan:
    enabled: true
  chassis_raw:
    enabled: true
  ext_mic:
    enabled: true
    network_sources:
      - ssh_host: "192.168.41.1"
        ssh_user: "ubuntu"
        ssh_password: "123"
        port: 9800
        sender_path: "/home/ubuntu/audio_sender.py"
  light:
    enabled: true
