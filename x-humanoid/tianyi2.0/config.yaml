mcp_port: 15707
ros_namespace: ""   # 留空则自动使用 hostname
name: "Tianyi 2.0 Pro"

# Run the skeleton publisher in its own ROS process. The main bundle keeps
# the other cards but does not publish a competing joints topic.
joints_bridge:
  enabled: true

slamtec:
  base_url: "http://192.168.11.1:1448"

plugins:
  state:
    enabled: true
  camera:
    enabled: true
  imu:
    enabled: true
  camera_depth:
    enabled: true
    # Raw 640x480 Z16 is 614 KiB/frame. Keep the dashboard stream below the
    # browser/DDS forwarding budget and always display the newest frame.
    hz: 8
  camera_pointcloud:
    enabled: true
    # Head camera height above the floor. The point-cloud renderer uses Y=0
    # as its grid plane, so raise the gravity-levelled cloud by this amount.
    floor_offset_m: 1.50
  asr:
    enabled: true
  nav_state:
    enabled: true
  power_board:
    enabled: true
  motors:
    enabled: true
  hand_state:
    enabled: true
  remote_event:
    enabled: true
  head:
    enabled: true
  head_gesture:
    enabled: true
  arm:
    enabled: true
  arm_gesture:
    enabled: true
  waist:
    enabled: true
  hand:
    enabled: true
  tts:
    enabled: true
  voice_play:
    enabled: true
  nav:
    enabled: true
  home:
    enabled: true
  chat:
    enabled: true
  voice_chat:
    enabled: true
  controlled_spatial:
    enabled: true
    native_slam_pcd_dir: "/opt/phanthy-motus/data/maps"
    native_slam_db_path: "/opt/phanthy-motus/data/controlled_spatial.db"
    password: "123456"
  controlled_spatial_map:
    enabled: true
    native_slam_db_path: "/opt/phanthy-motus/data/controlled_spatial.db"
    cache_dir: "/opt/phanthy-motus/data/map-visuals"
    poll_hz: 3.0
    artifact_hz: 0.4
    head_pointcloud_enabled: true
    head_pointcloud_topic: "/ob_camera_head/depth/points"
    head_recording_enabled: false
  robot_faults:
    enabled: true
  laser_scan:
    enabled: true
  chassis_raw:
    enabled: true
  ext_mic:
    enabled: true
    network_sources:
      - ssh_host: "192.168.41.1"
        ssh_user: "ubuntu"
        ssh_password: "123"
        port: 9800
        sender_path: "/home/ubuntu/audio_sender.py"
  light:
    enabled: true
  fall:
    enabled: true
    # 头部深度相机离地高度（米）。与 camera_pointcloud 的 floor_offset_m 同一个量，
    # 上机标定一次：让机器人平视地面，取一组点算出的高度应当接近 0。
    camera_height_m: 1.50
    # 人体最高点低于 fall_top_m 判低位，高于 recover_top_m 判已起身，
    # 中间区间不作判断。坐在地上时头顶约 0.9 m，站立约 1.6 m。
    fall_top_m: 0.70
    recover_top_m: 1.00
    min_duration_sec: 5.0
    eval_hz: 2.0
