mcp_port: 15709
name: "Bumi Edu Max"

# DDS CycloneDDS 配置
dds:
  config_file: "config/dds.xml"

# 手柄直连配置（不需要手柄，已禁用）
joystick_direct:
  enabled: false
  port: "/dev/input/js0"
  baudrate: 115200

# SDK 库路径（pybind11 编译产物）
sdk:
  build_path: "build"

plugins:
  # ── 传感器卡片 ──
  state:
    enabled: true          # joints + imu + battery + estop + robot_faults (多 tool)
  camera_head:
    enabled: true
  camera_depth:
    enabled: true
    hz: 8
  camera_pointcloud:
    enabled: true
    floor_offset_m: 0.98
  remote_event:
    enabled: false         # 算力板环境下 DDS 无法获取手柄数据，使用 joystick_direct 替代
  motors:
    enabled: true
  joystick_direct:
    enabled: false
  asr:
    enabled: true
  # ── MediaController 传感器卡片 ──
  media_system_status:
    enabled: true
  media_system_error:
    enabled: true
  microphone:
    enabled: true
  speaker_audio:
    enabled: true
  video_capture:
    enabled: true          # EDU版本: 相机在算力板上, 此卡依赖运控板回传, 需实测确认
  video_desensed:
    enabled: true          # EDU版本: 同上, 需实测确认
  # ── 执行器卡片 ──
  stand:
    enabled: true
  walk:
    enabled: true
  arm_gesture:
    enabled: true
  dance:
    enabled: true
  teach:
    enabled: true
  fall_recovery:
    enabled: true
  tts:
    enabled: true
  voice_play:
    enabled: true
  chat:
    enabled: true
  voice_chat:
    enabled: true
  # ── MediaController 执行器卡片 ──
  wakeword:
    enabled: true
  volume:
    enabled: true
  timeout_config:
    enabled: true
  beep_switch:
    enabled: true
  audio_routing:
    enabled: true
  audio_capture_control:
    enabled: true
  audio_playback_control:
    enabled: true
  video_capture_control:
    enabled: true
  external_audio_input:
    enabled: true
  external_audio_output:
    enabled: true
  external_video_input:
    enabled: true
  # ── 可选扩展卡片 ──
  rl_policy:
    enabled: false
    model_path: "policy/policy.onnx"
    config_path: "config/bumi_ac.yaml"
