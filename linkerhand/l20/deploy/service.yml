services:
  linkerhand-l20:
    image: bj-warehouse.tencentcloudcr.com/phanthy-motus/drivers/linkerhand/l20:latest
    container_name: embodied-linkerhand-l20
    privileged: true
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
    environment:
      - PYTHONUNBUFFERED=1
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
