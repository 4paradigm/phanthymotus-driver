linkerhand-l20:
  image: __IMAGE__
  container_name: embodied-linkerhand-l20
  network_mode: host
  privileged: true
  volumes:
    - /opt/phanthy-motus/dds-local.xml:/opt/phanthy-motus/dds-local.xml:ro
    - /opt/phanthy-motus/data/certs/cert.pem:/isolation/cert.pem:ro
    - /dev:/dev
    - /run/udev:/run/udev:ro
  environment:
    - ROS_DOMAIN_ID=42
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/phanthy-motus/dds-local.xml
    - PYTHONUNBUFFERED=1
    - AGENT_CORE_URL=https://127.0.0.1:15678
    - AGENT_CORE_CA=/isolation/cert.pem
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  restart: always
