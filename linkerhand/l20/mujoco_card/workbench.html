<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;color:#203237;background:#f4f6f4;font:14px/1.5 "PingFang SC","Microsoft YaHei",sans-serif}main{display:grid;grid-template-columns:minmax(0,1fr) 218px;gap:16px;padding:16px;height:100vh}section,aside{min-width:0}section{display:flex;flex-direction:column;gap:10px}.stage{position:relative;flex:1;min-height:260px;background:#14252c;border-radius:10px;overflow:hidden}canvas{height:100%;width:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.hint{position:absolute;bottom:10px;left:12px;color:#c5d7d9;font-size:11px;pointer-events:none}.bar{display:flex;align-items:center;gap:12px}.bar input{flex:1;min-width:0}.bar output{width:42px;text-align:right}button,select{border:1px solid #b9c8c9;border-radius:5px;color:inherit;background:white;padding:7px 10px}button{cursor:pointer}button:disabled{opacity:.5}.play{background:#1e5157;color:white;border:0;min-width:62px}aside{padding:4px 2px}h2{font-size:19px;margin:0 0 16px}label{display:block;margin:16px 0 4px;font-weight:600}select,input[type=range]{width:100%;accent-color:#16747b}label output{float:right}small,p{font-size:12px;color:#536668}dl{margin:10px 0 6px}dl div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #dce3e1}dd{margin:0;font-variant-numeric:tabular-nums}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}#message{min-height:19px;margin:6px 0;color:#526568}#message[data-error=true]{color:#a22b24}.sw1{background:#26bcb1}.sw2{background:#6299e7}@media(max-width:590px){main{grid-template-columns:1fr;grid-template-rows:minmax(245px,55vh) auto;height:auto;gap:7px}aside{padding:0}h2{margin:4px 0}label{margin-top:8px}}
.pad-key{display:grid;grid-template-columns:repeat(2,minmax(66px,1fr));gap:5px 9px;padding:0;margin:4px 0 10px;list-style:none}.pad-key li{display:flex;align-items:center;gap:7px}.pad-key i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px #0003}</style></head><body><main><section><div class="stage"><canvas aria-label="G20 虚拟手三维模型"></canvas><span class="hint">拖动旋转 · 滚轮缩放</span></div><div class="bar"><button id="liveBtn">实时</button><button class="play" id="play" disabled>回放</button><input aria-label="回放帧" id="frame" type="range" min="0" max="0" value="0" disabled><output id="progress">—</output></div></section>
<aside><h2 id="hand">L20 轨迹仿真</h2><dl><div><dt>显示</dt><dd id="mode">实时</dd></div><div><dt>状态</dt><dd id="activity">连接中</dd></div><div><dt>动作</dt><dd id="action">—</dd></div></dl>
<label for="speed">回放速度</label><select id="speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option></select>
<h3>指腹触觉区</h3><ul class="pad-key" id="padKey" aria-label="五指颜色"></ul><button id="reset">复位视角</button><p role="status" id="message">加载模型中…</p></aside></main>
<script>
'use strict';
const byId=id=>document.getElementById(id), canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
let port,seq=0;const pending=new Map();
function call(action,args={}){return new Promise((resolve,reject)=>{const id=String(++seq);
 const timeout=setTimeout(()=>{pending.delete(id);reject(Error('工作台连接超时'));},20000);
 pending.set(id,{resolve,reject,timeout});port.postMessage({id,method:'call',args:{action,...args}});});}
function status(text,err=false){byId('message').textContent=text;byId('message').dataset.error=err;}
function decode(text,Type){const bytes=Uint8Array.from(atob(text),s=>s.charCodeAt(0));return new Type(bytes.buffer);}
let shapes=[], current=null, az=-.48,el=.28,zoom=1,side='right',drag=null;
const shellColor=[181,193,190];
function unpack(m){return {v:Float32Array.from(decode(m.vertices,Int16Array),x=>x/100000),
 f:decode(m.faces,Uint16Array),pad:m.pad_faces?decode(m.pad_faces,Uint8Array):null,padColor:m.pad_color};}
function showPadKey(meshes){
 const key=byId('padKey');key.replaceChildren();
 for(const mesh of meshes.filter(m=>m.pad_label)){
  const item=document.createElement('li'),swatch=document.createElement('i');
  swatch.style.backgroundColor='rgb('+mesh.pad_color.join(',')+')';
  item.append(swatch,mesh.pad_label);key.append(item);
 }
}
function transform(p){
 const [x,y,z,w,a,b,c]=p;
 return [1-2*(b*b+c*c),2*(a*b-w*c),2*(a*c+w*b),x,
 2*(a*b+w*c),1-2*(a*a+c*c),2*(b*c-w*a),y,
 2*(a*c-w*b),2*(b*c+w*a),1-2*(a*a+b*b),z];}
function paint(){
 const rect=canvas.getBoundingClientRect(), W=Math.round(rect.width),H=Math.round(rect.height);
 if(!W||!H)return;const ratio=Math.min(devicePixelRatio||1,1.7);
 if(canvas.width!==Math.round(W*ratio)||canvas.height!==Math.round(H*ratio)){canvas.width=Math.round(W*ratio);canvas.height=Math.round(H*ratio);}
 ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle='#14252c';ctx.fillRect(0,0,W,H);
 if(!current)return;
 const triangles=[],scale=Math.min(W/.32,H/.29)*zoom;
 const ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el);
 function mesh(shape,pose){
  const mat=transform(pose),local=shape.v, projected=new Float32Array(local.length);
  for(let i=0;i<local.length;i+=3){
   const a=local[i],b=local[i+1],c=local[i+2];
   const x=mat[0]*a+mat[1]*b+mat[2]*c+mat[3]-.033,y=mat[4]*a+mat[5]*b+mat[6]*c+mat[7]-(side==='right'?.017:-.017),z=mat[8]*a+mat[9]*b+mat[10]*c+mat[11]-.135;
   const u=-sa*x+ca*y,v=-se*(ca*x+sa*y)+ce*z,depth=ce*(ca*x+sa*y)+se*z;
   projected[i]=W*.5+u*scale;projected[i+1]=H*.51-v*scale;projected[i+2]=depth*scale;
  }
  const f=shape.f;
  for(let i=0;i<f.length;i+=3){
   const a=f[i]*3,b=f[i+1]*3,c=f[i+2]*3;
   const ux=projected[b]-projected[a],uy=projected[b+1]-projected[a+1],uz=projected[b+2]-projected[a+2];
   const vx=projected[c]-projected[a],vy=projected[c+1]-projected[a+1],vz=projected[c+2]-projected[a+2];
   const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
   if(nz>=-.025)continue;
   const light=.48+.52*Math.abs((nx*.29+ny*.47-nz*.83)/(Math.hypot(nx,ny,nz)||1));
   triangles.push([(projected[a+2]+projected[b+2]+projected[c+2])/3,projected,a,b,c,shape.pad?.[i/3]?shape.padColor:shellColor,Math.round(light*18)/18]);
  }
 }
 shapes.forEach((s,i)=>mesh(s,current[i]));
 triangles.sort((a,b)=>a[0]-b[0]);
 for(const [,v,a,b,c,col,k] of triangles){
  ctx.fillStyle='rgb('+col.map(x=>Math.min(255,Math.round(x*k))).join(',')+')';
  ctx.beginPath();ctx.moveTo(v[a],v[a+1]);ctx.lineTo(v[b],v[b+1]);ctx.lineTo(v[c],v[c+1]);ctx.closePath();ctx.fill();
 }
 }
let latest={}, history=[], historyId='', historyMs=50, at=0, timer=0, generation=0, mode='live', playing=false;
function stopReplay(){playing=false;clearTimeout(timer);byId('play').textContent='回放';}
function show(i){at=Math.max(0,Math.min(i,history.length-1));if(history[at])current=history[at];paint();byId('frame').value=at;byId('progress').textContent=(at+1)+'/'+history.length;}
function showMode(next){mode=next;byId('mode').textContent=next==='live'?'实时':'回放';}
async function loadRun(){
 const id=latest.last_id;if(!id)throw Error('还没有完整动作');
 if(historyId===id)return true;
 const token=++generation, total=latest.count, interval=latest.frame_ms, result=[];
 for(let i=0;i<total;i+=24){
  const part=await call('inspect',{run_id:id,offset:i,count:Math.min(total-i,24)});
  if(token!==generation)return;
  result.push(...part.frames);
 }
 history=result;historyId=id;historyMs=interval;at=0;byId('frame').max=total-1;return true;
}
async function poll(){
 try{
  latest=await call('live');byId('hand').textContent='G20 '+(side==='left'?'左手':'右手');
  byId('activity').textContent=latest.busy?'播放中':(latest.enabled?'就绪':'等待启动连线');
  byId('action').textContent=latest.action||'—';
  byId('play').disabled=byId('frame').disabled=!latest.count;
  if(mode==='live'){current=latest.poses;paint();byId('progress').textContent='—';byId('frame').max=Math.max(0,latest.count-1);}
  status(latest.rejected||(!latest.count&&!latest.busy?'等待已连接的轨迹源发送关节位置。':''));
 }catch(err){status(err.message,true);}
 setTimeout(poll,mode==='live'&&latest.busy?110:450);
}
function beginReplay(){if(!history.length)return;playing=true;byId('play').textContent='暂停';
 const step=()=>{if(!playing)return;show(at);if(at>=history.length-1){stopReplay();return;}at++;timer=setTimeout(step,historyMs/Number(byId('speed').value));};step();}
byId('play').onclick=async()=>{if(playing){stopReplay();return;}try{const wasLive=mode==='live';showMode('replay');if(!await loadRun()||mode!=='replay')return;if(wasLive||at>=history.length-1)at=0;beginReplay();}catch(e){status(e.message,true);}};
byId('frame').oninput=async e=>{const value=Number(e.target.value);stopReplay();showMode('replay');try{if(await loadRun()&&mode==='replay')show(value);}catch(err){status(err.message,true);}};
byId('liveBtn').onclick=()=>{stopReplay();generation++;showMode('live');if(latest.poses){current=latest.poses;paint();}};
byId('reset').onclick=()=>{az=side==='left'?.48:-.48;el=.28;zoom=1;paint();};
window.addEventListener('message',async e=>{if(e.source!==parent||e.data?.protocol!=='motus.workbench/1'||!e.ports[0]||port)return;
 port=e.ports[0];port.onmessage=({data})=>{const p=pending.get(data.id);if(!p)return;clearTimeout(p.timeout);pending.delete(data.id);data.error?p.reject(Error(data.error)):p.resolve(data.result);};
 try{const r=await call('geometry');side=r.side;shapes=r.meshes.map(unpack);showPadKey(r.meshes);az=side==='left'?.48:-.48;poll();}catch(err){status(err.message,true);}});
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(!drag)return;az-=(e.clientX-drag[0])*.009;el=Math.max(-1.45,Math.min(1.45,el+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];paint();};
canvas.onpointerup=canvas.onpointercancel=()=>{drag=null;};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.55,Math.min(2.5,zoom*Math.exp(-e.deltaY*.001)));paint();};
new ResizeObserver(paint).observe(canvas);
</script></body></html>
