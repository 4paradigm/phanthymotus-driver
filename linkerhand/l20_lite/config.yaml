mcp_port: 15733
ros_namespace: ""

ros:
  robot_domain_id: 42
  core_domain_id: 42

name: "LinkerHand L20 Lite"
# Fallback target when automatic detection is disabled.
side: "right"
serial_port: "/dev/ttyUSB0"
baudrate: 115200
response_timeout_s: 0.5

plugins:
  hand:
    enabled: true
    # Legacy unbound single-card mode: auto-select the sole hand on serial_port.
    # Bound multi-instance cards select left/right independently instead.
    auto_detect_gestures: true
    # Values used by the successful Ubuntu/USB-RS485 SDK hardware test.
    motion_speed: 60
    motion_torque: 100  # Default for each motion; open/close may override per call.
    motion_timeout_s: 8.0
    position_tolerance: 6
    poll_interval_s: 0.2
    # The operator confirmed these targets on both hands in this setup.
    # Keep each side's calibration explicit, even when the values match.
    # Recalibrate before deploying to different hardware.
    # Joint order: thumb root/sway, four finger roots, index/ring/pinky sway,
    # thumb roll. Values are 0..255 protocol position units, not degrees.
    open_pose: [254, 254, 254, 254, 254, 254, 127, 126, 127, 254]
    fist_pose: [93, 255, 0, 0, 0, 0, 128, 128, 128, 255]
    left_open_pose: [254, 254, 254, 254, 254, 254, 127, 126, 127, 254]
    left_fist_pose: [93, 255, 0, 0, 0, 0, 128, 128, 128, 255]
