mcp_port: 15733
ros_namespace: ""

ros:
  robot_domain_id: 42
  core_domain_id: 42

name: "LinkerHand L20 Lite"
# Fallback target when automatic detection is disabled.
side: "right"
serial_port: "/dev/ttyUSB0"
baudrate: 115200
response_timeout_s: 0.5

plugins:
  glove_teleop:
    enabled: true
    source_mode: "direct"
    # Override GLOVE_SERIAL_PORT with the receiver's stable path on this host.
    # An absent glove does not prevent the existing hand cards from starting.
    glove_port: "/dev/glove"
    source_ip: "127.0.0.1"
    listen_host: "127.0.0.1"
    listen_port: 19012
    max_hz: 15
    # Preview until reader + Modbus release timing is accepted on this hardware.
    preview_only: true
    # Candidate stale-input cutoff, NOT a measured physical release bound.
    watchdog_ms: 300
    max_delta_per_step: 16
    max_fraction_step: 0.05
    # Capture a stable pose over multiple source frames, rather than one click.
    calibration_window_ms: 300
    calibration_stability_deg: 8
    open_deadband: 0.10
    speed: 50
    torque: 50
  hand_gesture:
    enabled: true
    motion_speed: 85
    number_speed: 85
    thumb_speed_scaling: true
    motion_torque: 100
    motion_timeout_s: 8.0
    position_tolerance: 6
    poll_interval_s: 0.2
    # Both hands were checked by the operator. Recalibrate on other hardware.
    # Order: thumb root/sway, index/middle/ring/pinky root,
    # index/ring/pinky sway, thumb roll. Raw values 0..255, not angles.
    right_poses: &gesture_poses
      ok_gesture: [132, 28, 123, 255, 255, 255, 128, 128, 128, 255]
      thumb_up_gesture: [255, 255, 0, 0, 0, 0, 128, 128, 128, 255]
      v_sign_gesture: [0, 255, 255, 255, 0, 0, 128, 128, 128, 255]
      grasp_prep: [255, 0, 255, 255, 255, 255, 128, 128, 128, 255]
      grasp_target: [0, 0, 0, 0, 0, 0, 128, 128, 128, 255]
    left_poses: *gesture_poses
    right_number_poses: &number_poses
      0: [93, 255, 0, 0, 0, 0, 128, 128, 128, 255]
      1: [0, 255, 255, 0, 0, 0, 128, 128, 128, 255]
      2: [0, 255, 255, 255, 0, 0, 128, 128, 128, 255]
      3: [0, 255, 255, 255, 255, 0, 128, 128, 128, 255]
      4: [0, 255, 255, 255, 255, 255, 128, 128, 128, 255]
      5: [255, 255, 255, 255, 255, 255, 128, 128, 128, 255]
      6: [255, 255, 0, 0, 0, 255, 128, 128, 128, 255]
      7: [131, 32, 110, 110, 0, 0, 128, 128, 128, 218]
      8: [255, 255, 255, 0, 0, 0, 128, 128, 128, 255]
      9: [100, 81, 142, 0, 0, 0, 128, 128, 128, 172]
    left_number_poses: *number_poses
  hand:
    enabled: true
    # Legacy unbound single-card mode: auto-select the sole hand on serial_port.
    # Bound multi-instance cards select left/right independently instead.
    auto_detect_gestures: true
    # Values used by the successful Ubuntu/USB-RS485 SDK hardware test.
    motion_speed: 60
    motion_torque: 100  # Default for each motion; open/close may override per call.
    motion_timeout_s: 8.0
    position_tolerance: 6
    poll_interval_s: 0.2
    # The operator confirmed these targets on both hands in this setup.
    # Keep each side's calibration explicit, even when the values match.
    # Recalibrate before deploying to different hardware.
    # Joint order: thumb root/sway, four finger roots, index/ring/pinky sway,
    # thumb roll. Values are 0..255 protocol position units, not degrees.
    open_pose: [254, 254, 254, 254, 254, 254, 127, 126, 127, 254]
    fist_pose: [93, 255, 0, 0, 0, 0, 128, 128, 128, 255]
    left_open_pose: [254, 254, 254, 254, 254, 254, 127, 126, 127, 254]
    left_fist_pose: [93, 255, 0, 0, 0, 0, 128, 128, 128, 255]
