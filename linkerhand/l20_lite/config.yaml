mcp_port: 15733
ros_namespace: ""

ros:
  robot_domain_id: 42
  core_domain_id: 42

name: "LinkerHand L20 Lite"
# Fallback target when automatic detection is disabled.
side: "right"
serial_port: "/dev/ttyUSB0"
baudrate: 115200
response_timeout_s: 0.5

plugins:
  hand_tactile:
    enabled: true
    poll_hz: 10.0
    auto_start: true
    matrix_enabled: true
    matrix_request_interval_s: 0.05
    tactile_timeout_s: 1.0
    matrix_timeout_s: 0.25
    stale_after_s: 1.0
    contact_threshold: 8
  hand_gesture:
    enabled: true
    motion_speed: 85
    number_speed: 85
    thumb_speed_scaling: true
    motion_torque: 100
    motion_timeout_s: 8.0
    position_tolerance: 6
    poll_interval_s: 0.2
    # Both hands were checked by the operator. Recalibrate on other hardware.
    # Order: thumb root/sway, index/middle/ring/pinky root,
    # index/ring/pinky sway, thumb roll. Raw values 0..255, not angles.
    right_poses: &gesture_poses
      ok_gesture: [132, 28, 123, 255, 255, 255, 128, 128, 128, 255]
      thumb_up_gesture: [255, 255, 0, 0, 0, 0, 128, 128, 128, 255]
      v_sign_gesture: [0, 255, 255, 255, 0, 0, 128, 128, 128, 255]
      grasp_prep: [255, 0, 255, 255, 255, 255, 128, 128, 128, 255]
      grasp_target: [0, 0, 0, 0, 0, 0, 128, 128, 128, 255]
    left_poses: *gesture_poses
    right_number_poses: &number_poses
      0: [93, 255, 0, 0, 0, 0, 128, 128, 128, 255]
      1: [0, 255, 255, 0, 0, 0, 128, 128, 128, 255]
      2: [0, 255, 255, 255, 0, 0, 128, 128, 128, 255]
      3: [0, 255, 255, 255, 255, 0, 128, 128, 128, 255]
      4: [0, 255, 255, 255, 255, 255, 128, 128, 128, 255]
      5: [255, 255, 255, 255, 255, 255, 128, 128, 128, 255]
      6: [255, 255, 0, 0, 0, 255, 128, 128, 128, 255]
      7: [131, 32, 110, 110, 0, 0, 128, 128, 128, 218]
      8: [255, 255, 255, 0, 0, 0, 128, 128, 128, 255]
      9: [100, 81, 142, 0, 0, 0, 128, 128, 128, 172]
    left_number_poses: *number_poses
  hand:
    enabled: true
    # Legacy unbound single-card mode: auto-select the sole hand on serial_port.
    # Bound multi-instance cards select left/right independently instead.
    auto_detect_gestures: true
    # Values used by the successful Ubuntu/USB-RS485 SDK hardware test.
    motion_speed: 60
    motion_torque: 100  # Default for each motion; open/close may override per call.
    motion_timeout_s: 8.0
    position_tolerance: 6
    poll_interval_s: 0.2
    # The operator confirmed these targets on both hands in this setup.
    # Keep each side's calibration explicit, even when the values match.
    # Recalibrate before deploying to different hardware.
    # Joint order: thumb root/sway, four finger roots, index/ring/pinky sway,
    # thumb roll. Values are 0..255 protocol position units, not degrees.
    open_pose: [254, 254, 254, 254, 254, 254, 127, 126, 127, 254]
    fist_pose: [93, 255, 0, 0, 0, 0, 128, 128, 128, 255]
    left_open_pose: [254, 254, 254, 254, 254, 254, 127, 126, 127, 254]
    left_fist_pose: [93, 255, 0, 0, 0, 0, 128, 128, 128, 255]
  # 连续视觉跟随：订阅 actucore handdrive 的 motus.hand/1 data/json。
  # 这不是 LLM 调用式动作：start/resume 时各确认一次安全，之后按帧流驱动；
  # 数据超时会释放力矩并要求重新 start。位置值仍是 0..255 原始协议值。
  hand_visual_follow:
    enabled: true
    # 110 = 操作员在这台硬件上验证过的 firm 抓握速度，是本项目已知的最大
    # 安全值；255 只是协议上限，不是机械安全上限，代码会拒绝超过 110。
    # 拇指三个关节按真实减速比自动降到约 46%，与 gesture_device 一致。
    speed: 110
    # 官方速度倍率：实际速度 = speed × ratio（封顶255），再按拇指减速比缩放。
    # 3.0x=255 是官方支持的最快档；拇指仍有减速比保护。
    speed_ratio: 3.0
    torque: 100
    max_hz: 20
    # 单条命令每个关节最多移动多少原始位置单位；越大越跟手，也越危险。
    # 64 约 0.3 秒到位，仍有逐帧限幅；255 会一帧到底、失去保护。
    max_step: 128
    # 整图 RTMPose 对拇指算出的弯曲量系统性偏小，单独放大；1.0=不放大。
    # 拇指弯曲电机(joint0)的握拳终点，独立于 fist_pose。
    # 用操作员验证过的 OK 手势拇指 root 值；93 对该电机无可见弯曲。
    thumb_root_fist: 0
    # 拇指 ROOT 弯曲电机的行程 0~1：值越小弯得越少、拇指越往外立起（垂直掌面）。
    # 1.0=原全程（撞机），0.4=只弯 40%。root 撞食指就调小，弯不够就调大。
    thumb_travel: 0.4
    # 横扫/翻滚单独限制（比 root 更小=更往外翻，拇指尖停在食指尖旁而不是压上去）。
    # OK 手势指尖重叠就调小 roll_travel（如 0.3）；够不到就调大（如 0.5）。
    thumb_sway_travel: 0.35
    thumb_roll_travel: 0.25
    # 拇指对掌判定阈值（按掌宽归一化的距离比，真机 mock 标定）：
    # 张开时最近指尖≈1.35/掌心≈2.06，握拳时≈0.12/0.57。
    thumb_from_landmarks: true
    # 自适应范围（推荐）：自动把真实画面权重的最小~最大映射到 0~1，
    # 不用猜参数。第一次张开/握拳后即学会该用户的实际范围，电机行程铺满。
    # info 动作里的 thumb_observed_range 能看到学到的范围。
    thumb_adaptive: true
    # 仅当 thumb_adaptive:false 时才用固定拉伸 w'=clamp(w*gain+bias)。
    thumb_gain: 1.8
    thumb_bias: 0.0
    # 四指 root 关节弯曲量同样偏小，单独放大；1.0=不放大。
    flexion_gain: 1.0
    # 指根弯曲权重曲线：gamma<1 把中低段弯曲推向 fist 端，让第一关节
    # 真正弯下去；端点 0/1 不变，不会越界。0.3 时 0.3 弯曲≈0.97 权重，弯得更狠。
    flexion_gamma: 1.0
    # 视觉侧"人手全弯"flexion 值；人手弯到底时据此映射到 fist_pose。
    fist_reference: 0.6
    # 协同已禁用：每指完全独立，抖动只靠 per-finger 死区滤除。
    synergy_weight: 0.0
    # 死区：手指转角变化不到这个值就忽略。太大（如 10 度）会连正常弯曲
    # 都过滤掉，导致近节指骨弯不下去；3 度足够滤掉抖动。范围 0..45。
    angle_deadband_deg: 4
    # 展览会场景：手暂时离开时保持姿势，5000ms(代码上限)后仍无人再松手。
    watchdog_ms: 5000
    max_obs_age_ms: 500
    require_handedness: true
    # 与上面的 hand 卡标定保持一致；这些值只适用于已确认的这对硬件。
    right_open_pose: [254, 254, 254, 254, 254, 254, 127, 126, 127, 254]
    right_fist_pose: [93, 255, 0, 0, 0, 0, 128, 128, 128, 255]
    left_open_pose: [254, 254, 254, 254, 254, 254, 127, 126, 127, 254]
    left_fist_pose: [93, 255, 0, 0, 0, 0, 128, 128, 128, 255]
