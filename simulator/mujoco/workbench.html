:root{
  --paper:#fbf8f3; --paper-2:#f4efe7; --line:#e6ded2; --ink:#2b2622; --ink-2:#6f665d; --ink-3:#a39a90;
  --brand:#b85a32; --brand-ink:#fff; --brand-soft:#f6e6dc;
  --ok:#2f7d4f; --ok-soft:#e5f2ea; --warn:#a86a12; --warn-soft:#fbf0dc; --bad:#b0392f; --bad-soft:#f8e3e0;
  --stage:#1c2633; --stage-2:#253244; --stage-ink:#d7e0ea; --stage-line:#34445a;
  --r:8px; --r-s:6px; --gap:12px; --top:44px; --rail:184px; --insp:256px; --bar:40px;
  font:13px/1.45 "PingFang SC","Noto Sans SC",system-ui,sans-serif; color:var(--ink);
}
*{box-sizing:border-box}
.pm-card{width:960px;height:660px;display:grid;grid-template-rows:var(--top) 1fr;background:var(--paper);
  border-radius:12px;overflow:hidden}
.pm-top{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.pm-title{font-weight:600;font-size:15px}
.pm-crumb{display:flex;gap:6px;color:var(--ink-2);min-width:0}
.pm-crumb a{color:inherit;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-crumb a[aria-current]{color:var(--ink);font-weight:600}
.pm-crumb a+a::before{content:"›";margin-right:6px;color:var(--ink-3)}
.pm-top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;
  border:1px solid var(--line);background:#fff;font-size:12px;color:var(--ink-2);cursor:pointer}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.chip[data-s=ok]{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip[data-s=ok]::before{background:var(--ok)}
.chip[data-s=busy]::before{background:var(--warn);animation:pulse 1.2s infinite}
.chip[data-s=bad]{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip[data-s=bad]::before{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.pm-body{display:grid;grid-template-columns:var(--rail) 1fr var(--insp);min-height:0}
.pm-body.no-rail{grid-template-columns:1fr var(--insp)}
.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rail-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.list{overflow:auto;flex:1;padding:0 8px 8px}
.item{padding:8px 10px;border-radius:var(--r-s);cursor:pointer;border-left:3px solid transparent}
.item:hover{background:var(--paper-2)}
.item[aria-selected=true]{background:var(--brand-soft);border-left-color:var(--brand)}
.item small{display:block;color:var(--ink-2);font-size:11px}
.center{display:grid;grid-template-rows:1fr var(--bar);min-height:0;padding:var(--gap);gap:8px}
.stage{position:relative;background:var(--stage);border-radius:var(--r);overflow:hidden;min-height:0;
  display:grid;place-items:center}
.stage>canvas,.stage>img,.stage>video{width:100%;height:100%;object-fit:contain;display:block}
.stage-tag{position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:4px;font-size:11px;
  background:rgba(12,18,26,.72);color:var(--stage-ink)}
.stage-tag.r{left:auto;right:8px}
.grid{display:grid;gap:6px;padding:6px;width:100%;height:100%;align-content:center;justify-content:center;
  grid-template-columns:repeat(var(--cols,4),minmax(0,var(--cw,1fr)));grid-auto-rows:auto}
.cell{position:relative;aspect-ratio:3/4;background:var(--stage-2);border-radius:var(--r-s);overflow:hidden;
  border:1px solid var(--stage-line);cursor:zoom-in;max-height:100%}
.cell canvas,.cell img{width:100%;height:100%;object-fit:contain}
.cell .lbl{position:absolute;left:4px;top:4px;font-size:10px;color:var(--stage-ink);
  background:rgba(12,18,26,.7);padding:1px 5px;border-radius:3px}
.phase{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--ink-2)}
.phase b{color:var(--ink)}
.phase .stale{color:var(--bad)}
.bar{display:flex;align-items:center;gap:8px}
.bar .msg{flex:1;font-size:12px;color:var(--ink-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar .msg.err{color:var(--bad)}
.btn{height:32px;padding:0 14px;border-radius:var(--r-s);border:1px solid var(--line);background:#fff;
  color:var(--ink);font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn:disabled{color:var(--ink-3);background:var(--paper-2);cursor:not-allowed}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.pri:disabled{opacity:.45;color:var(--brand-ink)}
.btn.sm{height:26px;padding:0 10px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%;height:40px}
.insp{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.insp-h{padding:12px 14px 4px;font-size:15px;font-weight:600;word-break:break-all}
.insp-b{flex:1;overflow:auto;padding:4px 14px}
.insp-f{padding:12px 14px;border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 8px;font-size:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--ink-2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px}
.tabs button{border:0;background:none;padding:8px 10px;color:var(--ink-2);font:inherit;cursor:pointer;
  border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.field{display:grid;gap:4px;margin:10px 0}
.field label{font-size:12px;color:var(--ink-2)}
.field input,.field select{height:30px;border:1px solid var(--line);border-radius:var(--r-s);padding:0 8px;
  background:#fff;font:inherit}
details.adv summary{cursor:pointer;color:var(--ink-2);font-size:12px;padding:6px 0}
.banner{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r-s);font-size:12px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner .sp{flex:1}
.sess{width:100%;border-collapse:collapse;font-size:13px}
.sess th{text-align:left;font-weight:500;color:var(--ink-2);font-size:12px;padding:8px 10px;
  border-bottom:1px solid var(--line)}
.sess td{padding:10px;border-bottom:1px solid var(--line)}
.sess tr[tabindex]:hover{background:var(--paper-2);cursor:pointer}
.ctl{font-size:12px;font-weight:500}
.ctl[data-c=me]{color:var(--brand)} .ctl[data-c=other]{color:var(--ink-2)} .ctl[data-c=none]{color:var(--warn)}
.steps{list-style:none;padding:0;margin:0}

.steps li::before{content:"○";color:var(--ink-3)}
.steps li[data-s=ok]::before{content:"●";color:var(--ok)}
.steps li[data-s=run]::before{content:"◐";color:var(--warn)}
.steps li[data-s=bad]::before{content:"✕";color:var(--bad)}
.log{background:var(--stage);color:var(--stage-ink);font:11px/1.5 ui-monospace,monospace;padding:8px;
  border-radius:var(--r-s);max-height:160px;overflow:auto;white-space:pre-wrap}
.sheet{position:absolute;inset:var(--top) 0 0 0;background:var(--paper);z-index:5;display:grid;
  grid-template-columns:1fr 320px;gap:var(--gap);padding:var(--gap)}
.dialog{position:absolute;inset:0;display:grid;place-items:center;background:rgba(30,24,20,.35);z-index:10}
.dialog>section{width:440px;max-height:90%;overflow:auto;background:var(--paper);border-radius:12px;padding:18px}

}

/* Saved environment references and their public labels; credentials stay in the host. */
function createConnectionDirectory({call,onChange}){
 let values={endpoint:'',environment_job:''},targets=[],jobs=[];
 const targetFor=job=>targets.find(target=>target.id===job?.target_id);
 function jobLabel(job){const target=targetFor(job),name=target?.label||target?.host||job.target_id||'环境';const mode=job.mode==='reuse'?'已有环境':job.mode==='isolated'?'独立环境':'已准备环境';const stamp=Number(job.created_at);const date=Number.isFinite(stamp)&&stamp>0?new Date(stamp*1000).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';return [name,mode,date].filter(Boolean).join(' · ');}

 $('release').onclick=perform(async()=>{inspect(await call('simulation_release',{session_id:session.id}));status('已暂停，当前仅观看');});
 return {prepare,run,create,detach,clear:clearSession,getSession:()=>session,async attach(id,binding={}){inspect(await call('simulation_attach',{session_id:id,...binding}));center();return session;},async restore(id){if(!id)return;inspect(await call('inspect',{mode:'state',session_id:id,detail:'compact'}));config.onRestore?.(session);center();},visible(value){active=value;viewEpoch++;clearTimeout(viewTimer);clearTimeout(settleTimer);if(value&&session){renderState();scheduleView();renew();}draw();}};
}

const $=id=>document.getElementById(id),pending=new Map(),viewId=workbenchUuid();
let port,sequence=0,queue=Promise.resolve(),catalog={profiles:[],models:[],datasets:[]},creating=false,createRequestId=null,connected=false;
const connectionDirectory=createConnectionDirectory({call,onChange(){updateTargetLabel();}});
function updateTargetLabel(){$('targetName').textContent=connectionDirectory.currentLabel()+(connected?' · 已连接':'');$('connectionCurrent').textContent='当前连接：'+connectionDirectory.currentLabel();}
function updateCreateButton(){$('create').disabled=creating||!connected||!catalog.profiles.some(profile=>profile.id===$('profile').value);}
function status(message,error=false){$('appStatus').textContent=message;$('appStatus').classList.toggle('quiet',message==='已连接');$('appStatus').classList.toggle('error',error);}
function friendlyError(message){return String(message||'').includes('policy target exceeds robot joint limits')?'策略输出超出关节限位，仿真已停止':String(message||'');}
function send(method,args={}){return new Promise((resolve,reject)=>{if(!port){reject(Error('尚未连接'));return;}const id=String(++sequence),timer=setTimeout(()=>{pending.delete(id);reject(Error('请求超时，请重试'));},18000);pending.set(id,{resolve,reject,timer});port.postMessage({id,method,args});});}
function request(method,args={}){const run=queue.then(()=>send(method,args));queue=run.catch(()=>{});return run;}
async function call(action,args={}){const value=await request('call',{action,view_id:viewId,...args});if(value?.state==='error'||value?.error)throw Error(value.message||value.error);return value;}
function perform(fn){return async event=>{const button=event?.currentTarget;if(button?.disabled)return;if(button)button.disabled=true;try{await fn();}catch(error){status(friendlyError(error.message),true);}finally{if(button)button.disabled=false;updateCreateButton();}};}
function options(id,items,empty){const current=$(id).value;$(id).replaceChildren();for(const item of [{id:'',label:empty},...items]){const option=document.createElement('option');option.value=item.id;option.textContent=item.label||item.name||item.id;$(id).append(option);}if(items.some(item=>item.id===current))$(id).value=current;}
function modelLabel(model){const name=catalog.datasets.find(d=>d.id===model.dataset_id)?.name||'训练策略',date=model.created_at?new Date(model.created_at*1000).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';return [name,date].filter(Boolean).join(' · ');}
const sim=createSimulationWorkbench({prefix:'',viewId,call,modelLabel,friendlyError,transport:call,onClosed(){sim.visible(false);$('debugView').classList.add('hidden');$('sessionsView').classList.remove('hidden');refreshSessions().catch(error=>status(error.message,true));},onChange(){updateCreateButton();}});
function showDebug(){ $('sessionsView').classList.add('hidden');$('debugView').classList.remove('hidden');sim.visible(true);const session=sim.getSession(),model=catalog.models.find(m=>m.id===session?.model_id);$('title').textContent=model?modelLabel(model):catalog.profiles.find(p=>p.id===session?.profile_id)?.label||'机器人调试';}
async function refreshSessions(){const result=await call('simulation_list');$('sessionList').replaceChildren();const sessions=(result.sessions||[]).filter(s=>s.state!=='closed');if(!sessions.length){const empty=document.createElement('div');empty.className='empty-state';empty.textContent='暂无调试会话';$('sessionList').append(empty);}for(const session of sessions){const row=document.createElement('article');row.className='session-row';const copy=document.createElement('div'),title=document.createElement('strong'),meta=document.createElement('small'),button=document.createElement('button');const model=catalog.models.find(m=>m.id===session.model_id);title.textContent=model?modelLabel(model):session.control_mode==='pd_hold'?'保持姿态':'自由物理';meta.textContent=[catalog.profiles.find(p=>p.id===session.profile_id)?.label||session.profile_id,({motion:'动作学习',simulation:'仿真调试'})[session.origin],{paused:'已暂停',running:'运行中',completed:'已完成',error:'异常'}[session.state]||session.state,session.control?.is_controller?'你控制中':session.control?.owner_view_id?'其他窗口控制':'无人控制'].filter(Boolean).join(' · ');copy.append(title,meta);button.textContent='打开观看';button.onclick=perform(async()=>{await sim.attach(session.id);showDebug();});row.append(copy,button);$('sessionList').append(row);}}
function profileChanged(){options('model',catalog.models.filter(m=>m.profile_id===$('profile').value).map(m=>({id:m.id,label:modelLabel(m)})),'不加载策略');modelChanged();}
function modelChanged(){const model=catalog.models.find(m=>m.id===$('model').value);$('modeField').classList.toggle('hidden',!!model);$('modelBinding').textContent=model?(model.qualification==='evaluated'?'已评估':'未评估')+' · 使用此版本的参考动作':'';createRequestId=null;updateCreateButton();}
async function refreshCatalog(){connected=false;updateCreateButton();catalog=await call('catalog');catalog.profiles??=[];catalog.models??=[];catalog.datasets??=[];options('profile',catalog.profiles,'选择机器人');if(catalog.profiles.length===1)$('profile').value=catalog.profiles[0].id;profileChanged();await refreshSessions();connected=true;updateTargetLabel();updateCreateButton();}
$('profile').onchange=profileChanged;$('model').onchange=modelChanged;$('controlMode').onchange=()=>{createRequestId=null;};$('refreshSessions').onclick=perform(refreshSessions);
$('create').onclick=perform(async()=>{if(!connected||!catalog.profiles.some(profile=>profile.id===$('profile').value))throw Error('机器人配置尚未加载，请稍候');creating=true;try{createRequestId??=workbenchUuid();const args={profile_id:$('profile').value,request_id:createRequestId};if($('model').value)args.model_id=$('model').value;else args.control_mode=$('controlMode').value;await sim.create(args);createRequestId=null;showDebug();}finally{creating=false;}});
$('backSessions').onclick=perform(async()=>{await sim.detach();sim.visible(false);$('debugView').classList.add('hidden');$('sessionsView').classList.remove('hidden');await refreshSessions();});
$('connection').onclick=perform(async()=>{const cfg=await request('config');connectionDirectory.setValues(cfg.values||{});$('endpoint').value=cfg.values?.endpoint||'';$('apiKey').value='';$('keyState').textContent=cfg.runtime_secret_set?.api_key?'凭证已保存':'';options('environmentRef',connectionDirectory.ready(),'选择已准备环境');$('environmentRef').value=connectionDirectory.currentRef;$('useEnvironment').disabled=!$('environmentRef').value;$('settings').showModal();options('environmentRef',await connectionDirectory.load(),'选择已准备环境');$('environmentRef').value=connectionDirectory.currentRef;$('useEnvironment').disabled=!$('environmentRef').value;});
$('environmentRef').onchange=()=>{$('useEnvironment').disabled=!$('environmentRef').value;};$('useEnvironment').onclick=perform(async()=>{const id=$('environmentRef').value;await request('config',{values:{environment_job:id}});connected=false;connectionDirectory.setValues({environment_job:id});sim.clear();await refreshCatalog();$('settings').close();});$('closeSettings').onclick=()=>$('settings').close();
$('saveConnection').onclick=perform(async()=>{const values={endpoint:$('endpoint').value.trim(),environment_job:''};if($('apiKey').value)values.api_key=$('apiKey').value;await request('config',{values});connected=false;connectionDirectory.setValues(values);$('apiKey').value='';sim.clear();await refreshCatalog();$('settings').close();});$('checkConnection').onclick=perform(async()=>{try{await call('check');$('health').textContent='当前连接正常';}catch(error){$('health').textContent=error.message;throw error;}});
window.addEventListener('message',async event=>{if(event.source!==parent||event.data?.protocol!=='motus.workbench/1'||!event.ports?.[0]||port)return;port=event.ports[0];port.onmessage=event=>{const pendingRequest=pending.get(event.data?.id);if(!pendingRequest)return;clearTimeout(pendingRequest.timer);pending.delete(event.data.id);event.data.error?pendingRequest.reject(Error(event.data.error)):pendingRequest.resolve(event.data.result);};try{const state=await call('info');connectionDirectory.setValues(state.config_values||{});if(state.environment_available)connectionDirectory.load().catch(()=>{});if(state.state==='unconfigured'){status('连接服务器后开始');return;}await refreshCatalog();if(state.session_id){await sim.restore(state.session_id);showDebug();}status('已连接');}catch(error){status(error.message,true);}});

document.querySelectorAll('[data-debug]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-debug]').forEach(node=>node.classList.toggle('active',node===button));document.querySelectorAll('[data-debug-panel]').forEach(panel=>panel.classList.toggle('hidden',panel.dataset.debugPanel!==button.dataset.debug));});

</script></body></html>
