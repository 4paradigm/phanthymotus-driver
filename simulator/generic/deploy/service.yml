simulator-generic:
  container_name: embodied-simulator-generic
  image: __IMAGE__
  # Required by scripts/check_service_yml.py, and required in fact: the topics
  # have to reach agent-core over the host's loopback, because the fleet DDS
  # profile keeps them there.
  network_mode: host
  volumes:
    # Path must match character for character. A typo makes Docker create a
    # *directory* of that name, FastDDS falls back to every interface, and
    # nothing is logged.
    - /opt/phanthy-motus/dds-local.xml:/opt/phanthy-motus/dds-local.xml:ro
    # Drop a scenario YAML in here and refresh the canvas — no rebuild.
    - /opt/phanthy-motus/data/sim:/opt/phanthy-motus/data/sim
  environment:
    - ROS_DOMAIN_ID=42
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    # Mounting the profile selects nothing on its own.
    - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/phanthy-motus/dds-local.xml
    - ROS_LOCALHOST_ONLY=0
    - PYTHONUNBUFFERED=1
    - RCUTILS_COLORIZED_OUTPUT=0
    - AGENT_CORE_URL=${SIM_AGENT_CORE_URL:-https://localhost:15678}
    - SIM_SCENARIO_DIR=/opt/phanthy-motus/data/sim/scenarios
    # Recorded in every run report. A score with no configuration attached is
    # noise: the axis that matters is whether the number moved when the model,
    # the prompt or the image changed.
    - SIM_TIER=${SIM_TIER:-fidelity}
    - SIM_LLM_MODEL=${SIM_LLM_MODEL:-}
    - IMAGE_TAG=${IMAGE_TAG:-}
    - GIT_SHA=${GIT_SHA:-}
  # No privileged, no /dev, no device_cgroup_rules: there is no hardware. A
  # simulator that reaches outside its container has stopped being one.
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  # `always`, not `unless-stopped`. A host reboot leaves containers in the very
  # state `unless-stopped` refuses to start from, so after a restart nothing
  # comes back until someone SSHes in — which looks identical to a broken
  # deployment. See tests/test_deploy_restart_policy.py; this fragment was
  # copied from a driver that still had the old value, which is exactly the
  # propagation path that test exists to cut.
  restart: always
