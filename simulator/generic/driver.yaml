id: simulator-generic
name: Generic Simulator (Virtual Cards)
category: driver
hardware_provider: simulator
hardware_model: "generic"
image_name: simulator-generic
port: 15711
mcp_url: "http://localhost:15711/mcp"
description: "虚拟具身仿真 — 无硬件的传感器/执行器卡片，用于 Agent + VLA 回路测试、回归与演示"
build_context_extras:
  - ../../common
# Kept in sync by hand with config.yaml's `plugins.*.enabled`, as the other
# bundles do. 15711-15714 are reserved for simulator variants.
cards:
  - { name: odom,         type: sensor }
  - { name: imu,          type: sensor }
  - { name: laser_scan,   type: sensor }
  - { name: battery,      type: sensor }
  - { name: spatial_map,  type: sensor }
  - { name: model,        type: resource }
  - { name: loco,         type: actuator }
  - { name: controlled_spatial, type: actuator }
  - { name: switch_mode,  type: actuator }
  - { name: arm,          type: actuator }
  - { name: led,          type: actuator }
  - { name: tts,          type: actuator }
  # 订阅 audio/pcm-16k。接真实 tts 的输出，好让仿真世界听得见画布上绑的
  # 是 perception 合成器时说了什么 —— 否则基准测试的「世界真的做了什么」
  # 那一列在 agent 明明在说话时是空的。
  - { name: speaker,      type: actuator }
  - { name: sim_scenario, type: actuator }
  - { name: sim_report,   type: resource }
